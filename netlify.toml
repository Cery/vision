[build]
  publish = "public"
  command = "hugo --minify"

[build.environment]
  HUGO_VERSION = "0.147.1"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"
  # 编码环境变量
  LC_ALL = "zh_CN.UTF-8"
  LANG = "zh_CN.UTF-8"

[context.production.environment]
  HUGO_ENV = "production"
  LC_ALL = "zh_CN.UTF-8"
  LANG = "zh_CN.UTF-8"

[dev]
  port = 8888
  targetPort = 1316
  autoLaunch = true
  # 自动启动 Hugo 开发服务器，统一运行端口与函数代理（避开端口占用）
  command = "hugo server -D --port 1316 --baseURL /"

  [dev.environment]
    AIRTABLE_API_KEY = "pat39XNJcEyet48SK.83b699fc1a7d3fb3999d371ee4bc5f65ef62ffd4ab818d27eb575a15992ae016"
    AIRTABLE_BASE_ID = "appuBWUPmqALV2455"
    HUGO_BASEURL = "/"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# HTTP头部设置 - 确保正确的编码
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/css/*"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/js/*"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

# 图片资源优化配置
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/jpeg"

[[headers]]
  for = "*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/jpeg"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/png"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/webp"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

# Netlify Identity and Git Gateway Configuration
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://hm.baidu.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://picsum.photos https://fastly.picsum.photos; font-src 'self' data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' https://identity.netlify.com https://api.netlify.com"

# Identity and Git Gateway Redirects
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# 移除有问题的.netlify路径重定向
# [[redirects]]
#   from = "/.netlify/git/github"
#   to = "/admin/index.html"
#   status = 200

# 清理无必要的直通重写，避免本地开发代理中间层出现 500
# 多页面静态站点无需对同路径进行 200 重写，Hugo Dev 直接处理即可

# 处理其他路由
# 取消 SPA 式兜底重定向，避免多页面站点在开发环境被错误路由导致 500
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

# 移除有问题的.netlify身份验证重定向
# [[redirects]]
#   from = "/.netlify/identity/verify"
#   to = "/identity-callback.html"
#   status = 200

# 安全头部配置
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self' https://identity.netlify.com https://unpkg.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://unpkg.com https://hm.baidu.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://unpkg.com https://picsum.photos https://fastly.picsum.photos; font-src 'self' data: https://unpkg.com; connect-src 'self' https://identity.netlify.com https://api.netlify.com"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"