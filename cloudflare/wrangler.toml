name = "vision-api"
main = "src/index.js"
compatibility_date = "2024-09-10"
account_id = "594a18b97389b68fbc9769ab0cb47df7"
workers_dev = true

# Routes: 将 Worker 绑定到子域和主域路径前缀
routes = ["api.visndt.com/*", "visndt.com/api/*", "www.visndt.com/api/*"]

# D1 binding
[[d1_databases]]
binding = "DB"
database_name = "vision-demand-market"
database_id = "5a6d590d-43a2-482c-84ec-8ea0e9012632"

# 敏感配置请使用 Secrets 管理：
# 运行 `wrangler secret put ADMIN_KEY` 设置管理员密钥，不要在 toml 明文保存。