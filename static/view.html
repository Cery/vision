<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>需求详情 | Vision Market</title>
  <link href="/css/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="/css/vendor/font-awesome.min.css" rel="stylesheet">
  <link href="/css/vendor/font-awesome-fonts.css" rel="stylesheet">
  <link href="/css/business.css" rel="stylesheet">
  <style>
    .detail-header { background: #f8f9fa; padding: 2rem 0; border-bottom: 1px solid #e9ecef; }
    .meta-item { display: flex; align-items: center; margin-bottom: 0.5rem; color: #6c757d; }
    .meta-item i { width: 20px; text-align: center; margin-right: 8px; }
    .param-table th { width: 40%; background-color: #f8f9fa; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="/static/market.html"><i class="fa-solid fa-globe me-2"></i>Vision Market</a>
    <div class="ms-auto">
       <a href="/static/market.html" class="btn btn-outline-secondary btn-sm">返回列表</a>
    </div>
  </div>
</nav>

<div id="loading" class="text-center py-5">
  <div class="spinner-border text-primary" role="status"></div>
  <div class="mt-2 text-muted">正在加载详情...</div>
</div>

<div id="content" class="d-none">
  <!-- Header -->
  <div class="detail-header">
    <div class="container">
      <div class="row">
        <div class="col-lg-8">
          <div class="mb-2">
            <span class="badge bg-primary me-2" id="catBadge">分类</span>
            <span class="badge bg-secondary" id="statusBadge">状态</span>
          </div>
          <h1 class="fw-bold mb-3" id="reqTitle">需求标题</h1>
          <div class="d-flex flex-wrap gap-4 small text-muted">
            <span><i class="fa-regular fa-calendar me-1"></i>发布于 <span id="pubDate">-</span></span>
            <span><i class="fa-solid fa-hashtag me-1"></i>编号: <span id="reqId">-</span></span>
          </div>
        </div>
        <div class="col-lg-4 d-flex flex-column justify-content-center align-items-lg-end mt-3 mt-lg-0">
          <div class="fs-3 fw-bold text-primary mb-1" id="budgetRange">面议</div>
          <div class="text-muted small mb-3">预算范围</div>
          <div class="d-flex gap-2">
             <button class="btn btn-primary" id="actionQuote">
               <i class="fa-solid fa-paper-plane me-1"></i> 参与报价
             </button>
             <button class="btn btn-outline-secondary" id="actionEntry">
               <i class="fa-solid fa-key me-1"></i> 凭密码查看
             </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Body -->
  <div class="container py-5">
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="card shadow-sm mb-4 border-0">
          <div class="card-body">
            <h5 class="card-title border-bottom pb-2 mb-3">需求描述</h5>
            <div class="card-text text-secondary" id="publicPreview">
              <!-- Content -->
            </div>
          </div>
        </div>
        
        <div class="card shadow-sm border-0" id="paramsCard">
          <div class="card-body">
            <h5 class="card-title border-bottom pb-2 mb-3">技术参数</h5>
            <div class="table-responsive">
              <table class="table table-bordered mb-0 param-table">
                <tbody id="paramsBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      
      <div class="col-lg-4">
        <div class="card shadow-sm border-0 mb-4">
          <div class="card-body">
            <h5 class="card-title mb-3">发布方信息</h5>
            <div id="contactInfo">
              <!-- Dynamic Content -->
              <div class="alert alert-light border mb-0 small text-center text-muted">
                <i class="fa-solid fa-lock me-1"></i> 联系方式仅对登录供应商或凭密码可见
              </div>
            </div>
          </div>
        </div>
        
        <div class="card shadow-sm border-0 bg-light">
          <div class="card-body">
            <h6 class="fw-bold mb-2"><i class="fa-solid fa-circle-info me-2 text-primary"></i>提示</h6>
            <p class="small text-muted mb-0">
              如果您是该需求的发布方，请使用 <a href="/static/entry-demand.html">发布方入口</a> 查看完整报价。<br><br>
              如果您是供应商，请使用 <a href="/static/entry-supplier.html">供应商入口</a> 登录后参与报价。
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/vendor/bootstrap.bundle.min.js"></script>
<script>
(function() {
  const isProd = /(^|\.)visndt\.com$/i.test(location.hostname);
  const defaultRemote = 'https://api.visndt.com';
  let saved = ''; try { saved = localStorage.getItem('API_BASE') || ''; } catch {}
  const allowInProd = new Set(['', 'https://api.visndt.com']);
  window.API_BASE = (isProd ? (allowInProd.has(saved) ? saved : '') : (saved || defaultRemote)).replace(/\/$/, '');
  if (location.protocol === 'https:' && /^http:\/\//i.test(window.API_BASE)) window.API_BASE = isProd ? '' : defaultRemote;
})();

const App = {
  id: new URLSearchParams(location.search).get('id'),
  
  async init() {
    if (!this.id) {
      alert('无效的需求ID');
      location.href = '/static/market.html';
      return;
    }
    await this.loadDetail();
    this.bindEvents();
  },
  
  async loadDetail() {
    try {
      let res = await fetch((window.API_BASE || '') + `/api/markets/${encodeURIComponent(this.id)}`);
      if (!res.ok) res = await fetch((window.API_BASE || '') + `/api/requirements/${encodeURIComponent(this.id)}`);
      if (!res.ok) throw new Error('Load failed');
      const raw = await res.json();
      const data = raw.requirement || raw;
      this.render(data);
    } catch (e) {
      document.getElementById('loading').innerHTML = `<div class="text-danger">加载失败: ${e.message}</div>`;
    }
  },
  
  render(data) {
    document.getElementById('loading').classList.add('d-none');
    document.getElementById('content').classList.remove('d-none');
    
    // Header
    document.title = `${data.Title || '详情'} | Vision Market`;
    document.getElementById('reqTitle').textContent = data.Title || '无标题';
    document.getElementById('reqId').textContent = data.RequirementID || this.id;
    document.getElementById('catBadge').textContent = data.PrimaryCategory || data.primaryCategory || '未分类';
    document.getElementById('statusBadge').textContent = data.Status || data.status || '未知';
    document.getElementById('pubDate').textContent = (data.PublishedAt || data.published_at || '').split('T')[0];
    document.getElementById('budgetRange').textContent = data.BudgetRange || data.budget_range || '面议';
    
    // Preview
    const preview = data.PublicPreview || data.public_preview || '暂无描述';
    document.getElementById('publicPreview').innerHTML = escapeHtml(preview).replace(/\n/g, '<br>');
    
    // Params
    const params = data.ParametersJSON || data.parameters_json || data.Parameters || {};
    const tbody = document.getElementById('paramsBody');
    if (params && Object.keys(params).length > 0) {
      tbody.innerHTML = Object.entries(params).map(([k, v]) => `
        <tr>
          <th class="fw-normal text-muted">${escapeHtml(k)}</th>
          <td>${escapeHtml(v)}</td>
        </tr>
      `).join('');
    } else {
      document.getElementById('paramsCard').classList.add('d-none');
    }
    
    // Contact Public Check
    if (data.ContactPublic || data.contact_public) {
      document.getElementById('contactInfo').innerHTML = `
        <ul class="list-unstyled mb-0">
          <li class="mb-2"><i class="fa-regular fa-building me-2 text-muted"></i>${escapeHtml(data.ContactCompany||data.contact_company||'-')}</li>
          <li class="mb-2"><i class="fa-regular fa-user me-2 text-muted"></i>${escapeHtml(data.ContactName||data.contact_name||'-')}</li>
        </ul>
      `;
    }
    
    // Buttons
    const isOpen = (typeof data.AllowOpenQuotes !== 'undefined') ? data.AllowOpenQuotes : data.allow_open_quotes;
    const btnQuote = document.getElementById('actionQuote');
    if (!isOpen) {
      btnQuote.classList.add('disabled');
      btnQuote.innerHTML = '<i class="fa-solid fa-ban me-1"></i> 暂不开放报价';
    }
  },
  
  bindEvents() {
    document.getElementById('actionEntry').addEventListener('click', () => {
      location.href = `/static/entry.html?id=${encodeURIComponent(this.id)}`;
    });
    document.getElementById('actionQuote').addEventListener('click', () => {
      if (document.getElementById('actionQuote').classList.contains('disabled')) return;
      // Redirect to supplier portal with pre-fill intent, or entry.html
      // Let's send them to entry.html which handles both general access and jumping to supplier flow if implemented
      location.href = `/static/entry.html?id=${encodeURIComponent(this.id)}`;
    });
  }
};

function escapeHtml(s) {
  if (!s && s !== 0) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;'}[m]));
}

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
