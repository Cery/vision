<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>案例中心</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/business.css">
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">Vision NDT · 案例中心</div>
      <div>
        <a class="btn" href="news.html">资讯中心</a>
      </div>
    </div>

    <div class="filters">
      <input id="searchInput" class="input" placeholder="搜索案例标题或客户">
      <select id="industrySelect" class="select">
        <option value="">全部行业</option>
        <option>航空航天</option>
        <option>能源电力</option>
        <option>石油化工</option>
        <option>交通轨道</option>
      </select>
      <button id="reloadBtn" class="btn">刷新</button>
    </div>

    <div id="grid" class="grid"></div>
    <div class="footer">用真实项目成果，呈现可复制的解决方案与业务价值。</div>
  </div>

  <script>
    const state={items:[],filtered:[]}
    function fmtDate(s){try{const d=new Date(s);return d.toLocaleDateString()}catch{return s}}
    async function load(){
      try{const r=await fetch('data/cases.json');const d=await r.json();state.items=(d.items||[]).slice().sort((a,b)=> new Date(b.date)-new Date(a.date));render();}
      catch(e){document.getElementById('grid').innerHTML='<div class="card"><div class="body">加载失败</div></div>'}
    }
    function render(){
      const q=(document.getElementById('searchInput').value||'').trim().toLowerCase()
      const ind=(document.getElementById('industrySelect').value||'').trim()
      state.filtered=state.items.filter(it=>{
        const okI=!ind||it.industry===ind
        const okQ=!q|| (String(it.title||'').toLowerCase().includes(q) || String(it.client||'').toLowerCase().includes(q))
        return okI&&okQ
      })
      const grid=document.getElementById('grid');
      grid.innerHTML=state.filtered.map(it=>`
        <div class="card" onclick="openDetail('${it.id}')">
          <div class="thumb" style="background-image:url('${it.hero||''}')"></div>
          <div class="body">
            <div class="title">${escapeHtml(it.title||'未命名')}</div>
            <div class="meta">${fmtDate(it.date)} · ${escapeHtml(it.industry||'')}</div>
            <div class="muted">${escapeHtml(it.client||'')}</div>
          </div>
        </div>`).join('') || '<div class="muted">暂无内容</div>'
    }
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'})[c]})}
    function openDetail(id){const u=new URL('case-detail.html', location.origin);u.searchParams.set('id',id);location.href=u.toString()}
    document.addEventListener('DOMContentLoaded',()=>{
      document.getElementById('searchInput').addEventListener('input',render)
      document.getElementById('industrySelect').addEventListener('change',render)
      document.getElementById('reloadBtn').addEventListener('click',load)
      load()
    })
  </script>
</body>
</html>
