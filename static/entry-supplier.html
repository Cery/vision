<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>供应商入口｜我的报价</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background: #f7f7f7; }
      .container-narrow { max-width: 880px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .small-muted { color: #6c757d; font-size: .9rem; }
    </style>
  </head>
  <body>
    <div class="container container-narrow py-4">
      <header class="mb-4 d-flex align-items-center justify-content-between">
        <div>
          <h1 class="h4 mb-1">供应商入口</h1>
          <div class="small-muted">使用通行密码查看本人的报价记录</div>
        </div>
        <div>
          <a href="/" class="btn btn-outline-secondary btn-sm">返回首页</a>
        </div>
      </header>

      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <form id="loginForm" class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label">供应商通行密码 <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="supPwd" placeholder="供应商通行密码" required>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">（可选）需求ID筛选</label>
              <input type="text" class="form-control" id="reqIdFilter" placeholder="R-2024-0001（可选）">
            </div>
            <div class="col-12 d-flex gap-2">
              <button type="submit" class="btn btn-primary">登录并查询报价</button>
              <button type="button" id="logoutBtn" class="btn btn-outline-secondary" disabled>退出</button>
              <button type="button" id="gotoEntryBtn" class="btn btn-outline-primary">进入入口页</button>
            </div>
          </form>
        </div>
      </div>

      <div id="profileArea"></div>
      <div id="reqListArea" class="mt-3"></div>
      <div id="quotesArea" class="mt-3"></div>
    </div>

    <script>
      // 统一 Cloudflare API 基础地址（与管理页一致）：生产同源 /api，本地/其他默认远端，可被 localStorage 覆盖
      (function() {
        const isProd = /(^|\.)visndt\.com$/i.test(location.hostname);
        const defaultRemote = 'https://api.visndt.com';
        let saved = '';
        try { saved = (typeof localStorage !== 'undefined') ? (localStorage.getItem('API_BASE') || '') : ''; } catch {}
        const allowInProd = new Set(['', 'https://api.visndt.com']);
        if (isProd) {
          window.API_BASE = allowInProd.has(saved) ? saved : '';
        } else {
          window.API_BASE = saved || defaultRemote;
        }
        if (location.protocol === 'https:' && /^http:\/\//i.test(window.API_BASE||'')) {
          try { localStorage.removeItem('API_BASE'); } catch {}
          window.API_BASE = isProd ? '' : defaultRemote;
        }
        window.API_BASE = String(window.API_BASE).replace(/\/$/, '');
      })();

      async function apiFetch(path, options = {}) {
        const url = window.API_BASE + path;
        const headers = { 'Content-Type': 'application/json' };
        if (options.headers) Object.assign(headers, options.headers);
        const res = await fetch(url, { ...options, headers });
        if (!res.ok) {
          let errText = await res.text().catch(() => '');
          throw new Error(`HTTP ${res.status}: ${errText || res.statusText}`);
        }
        const ct = res.headers.get('content-type') || '';
        return ct.includes('application/json') ? res.json() : res.text();
      }

      const loginForm = document.getElementById('loginForm');
      const logoutBtn = document.getElementById('logoutBtn');
      const profileArea = document.getElementById('profileArea');
      const quotesArea = document.getElementById('quotesArea');
      const gotoEntryBtn = document.getElementById('gotoEntryBtn');

      let session = null;

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        quotesArea.innerHTML = '';
        profileArea.innerHTML = '';
        document.getElementById('reqListArea').innerHTML = '';
        const supPwd = document.getElementById('supPwd').value.trim();
        const reqFilter = document.getElementById('reqIdFilter').value.trim();
        if (!supPwd) return;

        try {
          // Session (identity)
          const sess = await apiFetch('/api/suppliers/session', {
            method: 'POST',
            body: JSON.stringify({ password: supPwd })
          });
          session = { supplier: sess.supplier, password: supPwd };
          logoutBtn.disabled = false;
          renderProfile(session.supplier);

          // Quotes
          const params = new URLSearchParams();
          params.set('supplier_access_password', supPwd);
          params.set('supplier_id', session.supplier.SupplierID);
          if (reqFilter) params.set('requirement_id', reqFilter);
          const quotes = await apiFetch('/api/quotes?' + params.toString());
          renderQuotes(Array.isArray(quotes) ? quotes : []);

          // Requirements list
          await loadRequirementsList(supPwd);
        } catch (err) {
          session = null;
          logoutBtn.disabled = true;
          const div = document.createElement('div');
          div.className = 'alert alert-danger';
          div.textContent = '登录或查询失败：' + err.message;
          profileArea.appendChild(div);
        }
      });

      logoutBtn.addEventListener('click', () => {
        session = null;
        logoutBtn.disabled = true;
        profileArea.innerHTML = '';
        quotesArea.innerHTML = '';
        loginForm.reset();
      });

      if (gotoEntryBtn) {
        gotoEntryBtn.addEventListener('click', () => {
          const v = (document.getElementById('reqIdFilter').value||'').trim();
          if (!v) { alert('请先填写需求ID筛选'); return; }
          const url = new URL('entry.html', window.location.origin);
          url.searchParams.set('id', v);
          window.location.href = url.toString();
        });
      }

      function renderProfile(s) {
        const card = document.createElement('div');
        card.className = 'card shadow-sm';
        card.innerHTML = `
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <h2 class="h5 mb-0">我的资料</h2>
              <span class="badge bg-secondary mono">${escapeHtml(s.SupplierID)}</span>
            </div>
            <div class="mt-3">
              <div><strong>名称：</strong>${escapeHtml(s.Name || '')}</div>
              <div><strong>单位：</strong>${escapeHtml(s.Company || '')}</div>
            </div>
          </div>`;
        profileArea.appendChild(card);
      }

      function renderQuotes(quotes) {
        const card = document.createElement('div');
        card.className = 'card shadow-sm';
        const rows = quotes.map((q, i) => `
          <tr>
            <td class="mono">${i + 1}</td>
            <td class="mono">${escapeHtml(q.quote_id || '')}</td>
            <td class="mono">${escapeHtml(q.requirement_id || '')}</td>
            <td>${escapeHtml(q.price ?? q.amount ?? '')}</td>
            <td>${escapeHtml(q.notes ?? q.remarks ?? '')}</td>
            <td class="mono small">${escapeHtml(q.created_at || '')}</td>
          </tr>`).join('');
        card.innerHTML = `
          <div class="card-body">
            <h2 class="h5">我的报价记录（${quotes.length}）</h2>
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>报价ID</th>
                    <th>需求ID</th>
                    <th>报价</th>
                    <th>备注</th>
                    <th>时间</th>
                  </tr>
                </thead>
                <tbody>${rows || '<tr><td colspan="6" class="text-center text-muted">暂无记录</td></tr>'}</tbody>
              </table>
            </div>
          </div>`;
        quotesArea.appendChild(card);
      }

      async function loadRequirementsList(supPwd) {
        try {
          const r = await apiFetch('/api/requirements?limit=60');
          const list = Array.isArray(r) ? r : (r.items || []);
          renderRequirements(list, supPwd);
        } catch (e) {
          const div = document.createElement('div');
          div.className = 'alert alert-warning';
          div.textContent = '无法加载需求列表：' + e.message;
          document.getElementById('reqListArea').appendChild(div);
        }
      }

      function renderRequirements(items, supPwd) {
        const area = document.getElementById('reqListArea');
        const rows = (items||[]).map((it)=>{
          const id = it.RequirementID || it.requirement_id || it.id || '';
          const title = it.Title || it.title || '';
          const status = it.Status || it.status || '';
          const progress = it.Progress || it.progress || '';
          const open = (typeof it.AllowOpenQuotes !== 'undefined') ? !!it.AllowOpenQuotes : !!it.allow_open_quotes;
          return `
            <tr data-id="${escapeHtml(id)}">
              <td class="mono">${escapeHtml(id)}</td>
              <td class="text-truncate" title="${escapeHtml(title)}">${escapeHtml(title)}</td>
              <td>${escapeHtml(status)}</td>
              <td>${escapeHtml(progress)}</td>
              <td>${open ? '<span class="badge bg-success">开放报价</span>' : '<span class="badge bg-secondary">需密码</span>'}</td>
              <td>
                <button class="btn btn-outline-secondary btn-sm me-1" data-action="contact">查看联系方式</button>
                <button class="btn btn-outline-primary btn-sm me-1" data-action="quotes">查看报价</button>
                <button class="btn btn-outline-dark btn-sm" data-action="entry">入口</button>
              </td>
            </tr>`;
        }).join('');
        const card = document.createElement('div');
        card.className = 'card shadow-sm';
        card.innerHTML = `
          <div class="card-body">
            <h2 class="h5">需求列表</h2>
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead><tr><th>需求ID</th><th>标题</th><th>状态</th><th>进度</th><th>在线报价</th><th>操作</th></tr></thead>
                <tbody>${rows || '<tr><td colspan="6" class="text-center text-muted">暂无需求</td></tr>'}</tbody>
              </table>
            </div>
          </div>`;
        area.appendChild(card);

        card.querySelectorAll('button[data-action="contact"]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const tr = btn.closest('tr'); const id = tr?.dataset.id || '';
            if (!id) return;
            try {
              const detail = await apiFetch(`/api/requirements/${encodeURIComponent(id)}?supplier_access_password=${encodeURIComponent(supPwd)}`);
              showContactDetail(detail);
            } catch (e) {
              const div = document.createElement('div'); div.className='alert alert-danger'; div.textContent='获取联系方式失败：'+e.message; area.appendChild(div);
            }
          });
        });
        card.querySelectorAll('button[data-action="quotes"]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const tr = btn.closest('tr'); const id = tr?.dataset.id || '';
            if (!id) return;
            try {
              const qs = await apiFetch(`/api/quotes?requirement_id=${encodeURIComponent(id)}&supplier_access_password=${encodeURIComponent(supPwd)}`);
              showRequirementQuotes(id, Array.isArray(qs) ? qs : []);
            } catch (e) {
              const div = document.createElement('div'); div.className='alert alert-danger'; div.textContent='获取报价失败：'+e.message; quotesArea.appendChild(div);
            }
          });
        });
        card.querySelectorAll('button[data-action="entry"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const tr = btn.closest('tr'); const id = tr?.dataset.id || '';
            if (!id) return;
            const url = new URL('entry.html', window.location.origin);
            url.searchParams.set('id', id);
            url.searchParams.set('supplier_access_password', supPwd);
            window.location.href = url.toString();
          });
        });
      }

      function showContactDetail(detail) {
        const area = document.getElementById('reqListArea');
        const card = document.createElement('div');
        card.className = 'card shadow-sm';
        card.innerHTML = `
          <div class="card-body">
            <h2 class="h6">联系方式</h2>
            <div><strong>联系人：</strong>${escapeHtml(detail.contact_name || detail.ContactName || '')}</div>
            <div><strong>电话：</strong><span class="mono">${escapeHtml(detail.contact_phone || detail.ContactPhone || '')}</span></div>
            <div><strong>公司：</strong>${escapeHtml(detail.contact_company || detail.ContactCompany || '')}</div>
            <div><strong>邮箱：</strong>${escapeHtml(detail.contact_email || detail.ContactEmail || '')}</div>
            <div><strong>部门：</strong>${escapeHtml(detail.contact_department || detail.ContactDepartment || '')}</div>
          </div>`;
        area.appendChild(card);
      }

      function showRequirementQuotes(reqId, quotes) {
        const card = document.createElement('div');
        card.className = 'card shadow-sm';
        const rows = quotes.map((q, i) => `
          <tr>
            <td class="mono">${i + 1}</td>
            <td class="mono">${escapeHtml(q.quote_id || q.QuoteID || '')}</td>
            <td>${escapeHtml(q.supplier_name || q.SupplierCompanyName || '')}</td>
            <td>${escapeHtml(q.amount ?? q.Price ?? '')}</td>
            <td>${escapeHtml((q.currency || q.Currency || ''))}</td>
            <td>${escapeHtml(q.remarks ?? q.Remarks ?? '')}</td>
            <td class="mono small">${escapeHtml(q.created_at || q.CreatedAt || '')}</td>
          </tr>`).join('');
        card.innerHTML = `
          <div class="card-body">
            <h2 class="h6">需求 ${escapeHtml(reqId)} 的报价（${quotes.length}）</h2>
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead><tr><th>#</th><th>报价ID</th><th>供应商</th><th>报价</th><th>币种</th><th>备注</th><th>时间</th></tr></thead>
                <tbody>${rows || '<tr><td colspan="7" class="text-center text-muted">暂无报价</td></tr>'}</tbody>
              </table>
            </div>
          </div>`;
        document.getElementById('quotesArea').appendChild(card);
      }

      function escapeHtml(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      }
    </script>
  </body>
  </html>
