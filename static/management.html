<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运营管理 - VisNDT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>运营管理</h1>
        <div class="row">
            <div class="col-md-4">
                <h2>需求列表</h2>
                <div id="requirementsList" class="list-group"></div>
            </div>
            <div class="col-md-8">
                <h2>报价列表</h2>
                <div id="quotesPanel" style="display: none;">
                    <h3 id="selectedRequirement"></h3>
                    <button id="exportCsvBtn" class="btn btn-primary btn-sm mb-3">导出为 CSV</button>
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>供应商</th>
                                <th>联系人</th>
                                <th>电话</th>
                                <th>报价 (元)</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="quotesList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const requirementsList = document.getElementById('requirementsList');
            const quotesPanel = document.getElementById('quotesPanel');
            const selectedRequirement = document.getElementById('selectedRequirement');
            const quotesList = document.getElementById('quotesList');
            const exportCsvBtn = document.getElementById('exportCsvBtn');

            let currentQuotes = [];

            // Fetch and display requirements
            fetch('/.netlify/functions/listRequirements')
                .then(response => response.json())
                .then(data => {
                    const items = Array.isArray(data) ? data : (data.items || []);
                    requirementsList.innerHTML = items.map(req => `
                        <a href="#" class="list-group-item list-group-item-action" data-id="${req.RequirementID}">
                            ${req.Title || req.RequirementID || '未命名需求'}
                        </a>
                    `).join('');
                })
                .catch(() => {
                    requirementsList.innerHTML = '<div class="text-muted">无法加载需求列表，请检查 Netlify Functions 或 Airtable 配置。</div>';
                });

            // Handle requirement selection
            requirementsList.addEventListener('click', e => {
                e.preventDefault();
                if (e.target.classList.contains('list-group-item')) {
                    document.querySelectorAll('#requirementsList .list-group-item').forEach(el => el.classList.remove('active'));
                    e.target.classList.add('active');
                    const requirementID = e.target.dataset.id;
                    selectedRequirement.textContent = `需求: ${e.target.textContent.trim()}`;
                    quotesPanel.style.display = 'block';
                    window.loadQuotes(requirementID);
                }
            });

            // Load quotes for a requirement
            window.loadQuotes = function loadQuotes(requirementID) {
                fetch(`/.netlify/functions/listQuotes?RequirementID=${requirementID}`)
                    .then(response => response.json())
                    .then(data => {
                        currentQuotes = data.items;
                        quotesList.innerHTML = data.items.map(quote => `
                            <tr>
                                <td>${quote.SupplierCompanyName}</td>
                                <td>${quote.SupplierContact}</td>
                                <td>${quote.SupplierPhone}</td>
                                <td>${quote.Price}</td>
                                <td>
                                    <select class="form-select form-select-sm" data-id="${quote.id}" onchange="updateQuoteStatus(this)">
                                        <option value="接洽中" ${quote.Status === '接洽中' ? 'selected' : ''}>接洽中</option>
                                        <option value="已中标" ${quote.Status === '已中标' ? 'selected' : ''}>已中标</option>
                                        <option value="未中标" ${quote.Status === '未中标' ? 'selected' : ''}>未中标</option>
                                    </select>
                                </td>
                                <td>
                                    <button class="btn btn-danger btn-sm" onclick="deleteQuote('${quote.id}')">删除</button>
                                </td>
                            </tr>
                        `).join('');
                    })
                    .catch(() => {
                        quotesList.innerHTML = '<tr><td colspan="6" class="text-danger">无法加载报价列表，请在 Netlify Dev 环境下访问或完成部署配置。</td></tr>';
                    });
            }

            // Export quotes to CSV
            exportCsvBtn.addEventListener('click', () => {
                let csvContent = "data:text/csv;charset=utf-8,";
                csvContent += "供应商,联系人,电话,报价(元),状态\n";
                currentQuotes.forEach(quote => {
                    csvContent += `${quote.SupplierCompanyName},${quote.SupplierContact},${quote.SupplierPhone},${quote.Price},${quote.Status}\n`;
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "quotes.csv");
                document.body.appendChild(link);
                link.click();
            });
        });

        // Update quote status
        function updateQuoteStatus(selectElement) {
            const quoteId = selectElement.dataset.id;
            const status = selectElement.value;
            fetch('/.netlify/functions/updateQuoteStatus', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ quoteId, status }),
            }).then(() => {
                // 状态更新成功（可选：提示）
            }).catch(() => {
                alert('更新状态失败，请检查函数配置');
            });
        }

        // Delete quote
        function deleteQuote(quoteId) {
            if (confirm('Are you sure you want to delete this quote?')) {
                fetch('/.netlify/functions/deleteQuote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quoteId }),
                }).then(() => {
                    // Reload quotes
                    const active = document.querySelector('#requirementsList .list-group-item.active');
                    const requirementID = active ? active.dataset.id : '';
                    if (requirementID) window.loadQuotes(requirementID);
                }).catch(() => {
                    alert('删除失败，请检查函数配置');
                });
            }
        }
    </script>
</body>
</html>
