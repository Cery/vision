    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const requirementsList = document.getElementById('requirementsList');
            const quotesPanel = document.getElementById('quotesPanel');
            const selectedRequirement = document.getElementById('selectedRequirement');
            const quotesList = document.getElementById('quotesList');
            const exportCsvBtn = document.getElementById('exportCsvBtn');

            let currentQuotes = [];

            // 统一 Cloudflare API 基础地址（本地/生产），支持从 localStorage 覆盖
            try {
                const saved = localStorage.getItem('API_BASE') || '';
                if (saved && typeof saved === 'string') {
                    window.API_BASE = saved;
                }
            } catch {}
            window.API_BASE = window.API_BASE || (location.hostname === 'localhost' ? 'http://localhost:8787' : 'https://api.visndt.com');
            window.apiFetch = (path, opts={}) => fetch(`${window.API_BASE}${path}`, opts);

            // 加载并显示需求列表（Cloudflare D1）
            window.apiFetch('/api/requirements')
                .then(response => response.json())
                .then(data => {
                    const items = Array.isArray(data) ? data : (data.items || []);
                    requirementsList.innerHTML = items.map(req => `
                        <a href="#" class="list-group-item list-group-item-action" data-id="${req.RequirementID}">
                            ${req.Title || req.RequirementID || '未命名需求'}
                        </a>
                    `).join('');
                })
                .catch(() => {
                    requirementsList.innerHTML = '<div class="text-muted">无法加载需求列表，请检查 Cloudflare Workers/D1 部署。</div>';
                });

            // Handle requirement selection
            requirementsList.addEventListener('click', e => {
                e.preventDefault();
                if (e.target.classList.contains('list-group-item')) {
                    document.querySelectorAll('#requirementsList .list-group-item').forEach(el => el.classList.remove('active'));
                    e.target.classList.add('active');
                    const requirementID = e.target.dataset.id;
                    selectedRequirement.textContent = `需求: ${e.target.textContent.trim()}`;
                    quotesPanel.style.display = 'block';
                    window.loadQuotes(requirementID);
                }
            });

            // 加载某个需求的报价（需要管理员或密码访问）
            window.loadQuotes = function loadQuotes(requirementID) {
                const adminKey = document.getElementById('adminKeyInput')?.value || '';
                window.apiFetch(`/api/quotes?requirement_id=${encodeURIComponent(requirementID)}`, { headers: { 'X-Admin-Key': adminKey } })
                    .then(response => response.json())
                    .then(data => {
                        const items = Array.isArray(data) ? data : (data.items || []);
                        currentQuotes = items;
                        quotesList.innerHTML = items.map(quote => `
                            <tr>
                                <td>${quote.SupplierCompanyName || quote.supplier_name || ''}</td>
                                <td>${quote.SupplierContact || ''}</td>
                                <td>${quote.SupplierPhone || quote.supplier_phone || ''}</td>
                                <td>${quote.Price || quote.amount || ''}</td>
                                <td>
                                    <select class="form-select form-select-sm" data-id="${quote.quote_id || quote.id || ''}" onchange="updateQuoteStatus(this)">
                                        <option value="接洽中" ${(quote.Status||quote.status) === '接洽中' ? 'selected' : ''}>接洽中</option>
                                        <option value="已中标" ${(quote.Status||quote.status) === '已中标' ? 'selected' : ''}>已中标</option>
                                        <option value="未中标" ${(quote.Status||quote.status) === '未中标' ? 'selected' : ''}>未中标</option>
                                    </select>
                                </td>
                                <td>
                                    <button class="btn btn-danger btn-sm" onclick="deleteQuote('${quote.quote_id || quote.id || ''}')">删除</button>
                                </td>
                            </tr>
                        `).join('');
                    })
                    .catch(() => {
                        quotesList.innerHTML = '<tr><td colspan="6" class="text-danger">无法加载报价列表，请检查 Cloudflare Workers/D1 或本地 dev 环境。</td></tr>';
                    });
            }

        // Export quotes to CSV
        if (exportCsvBtn) {
        exportCsvBtn.addEventListener('click', () => {
          let csvContent = "data:text/csv;charset=utf-8,";
          csvContent += "供应商,联系人,电话,报价(元),状态\n";
          currentQuotes.forEach(quote => {
            csvContent += `${quote.SupplierCompanyName},${quote.SupplierContact},${quote.SupplierPhone},${quote.Price},${quote.Status}\n`;
          });

          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", "quotes.csv");
          document.body.appendChild(link);
          link.click();
        });
        }
        // 导出为 Excel（兼容 .xls）
        (function addXlsExport(){
          try {
            const exportXlsBtn = document.createElement('button');
            exportXlsBtn.className = 'btn btn-outline-success btn-sm ms-2';
            exportXlsBtn.innerHTML = '<i class="fa-solid fa-file-excel me-1"></i> 导出为 Excel';
            exportCsvBtn?.parentElement?.insertBefore(exportXlsBtn, exportCsvBtn?.nextSibling);
            exportXlsBtn.addEventListener('click', () => {
              const rows = (currentQuotes||[]).map(q =>
                `<tr><td>${q.SupplierCompanyName||''}</td><td>${q.SupplierContact||''}</td><td>${q.SupplierPhone||''}</td><td>${q.Price||''}</td><td>${q.Status||''}</td></tr>`
              ).join('');
              const html = `<!DOCTYPE html><html><head><meta charset="utf-8" /></head><body><table border="1"><thead><tr><th>供应商</th><th>联系人</th><th>电话</th><th>报价(元)</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;
              const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a'); a.href = url; a.download = 'quotes.xls';
              document.body.appendChild(a); a.click();
              setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
            });
          } catch {}
        })();
        });

        // Update quote status
        function updateQuoteStatus(selectElement) {
            const quoteId = selectElement.dataset.id;
            const status = selectElement.value;
            const adminKey = document.getElementById('adminKeyInput')?.value || '';
            window.apiFetch(`/api/quotes/${encodeURIComponent(quoteId)}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
                body: JSON.stringify({ status }),
            }).then(() => {
                // 状态更新成功（可选：提示）
            }).catch(() => {
                alert('更新状态失败，请检查 Cloudflare API 配置');
            });
        }

        // Delete quote
        function deleteQuote(quoteId) {
            if (confirm('Are you sure you want to delete this quote?')) {
                const adminKey = document.getElementById('adminKeyInput')?.value || '';
                window.apiFetch(`/api/quotes/${encodeURIComponent(quoteId)}`, {
                    method: 'DELETE',
                    headers: { 'X-Admin-Key': adminKey },
                }).then(() => {
                    // Reload quotes
                    const active = document.querySelector('#requirementsList .list-group-item.active');
                    const requirementID = active ? active.dataset.id : '';
                    if (requirementID) window.loadQuotes(requirementID);
                }).catch(() => {
                    alert('删除失败，请检查 Cloudflare API 配置');
                });
            }
        }
    </script>
    <script>
    // 侧栏与 offcanvas 导航联动：平滑滚动 + 高亮
    (function() {
      const sideNav = document.querySelector('.admin-sidenav .nav');
      const offNav = document.querySelector('#adminOffcanvas .nav');
      const links = document.querySelectorAll('.admin-sidenav .nav-link, #adminOffcanvas .nav-link');
      const ids = ['overview','requirements','quotes','settings'];
      const sections = ids.map(id => document.getElementById(id)).filter(Boolean);

      links.forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const id = link.getAttribute('href').replace('#','');
          const el = document.getElementById(id);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          const offEl = document.getElementById('adminOffcanvas');
          if (offEl && offEl.classList.contains('show')) {
            try { new bootstrap.Offcanvas(offEl).hide(); } catch(_) {}
          }
        });
      });

      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const id = entry.target.id;
            document.querySelectorAll('.admin-sidenav .nav-link, #adminOffcanvas .nav-link').forEach(a => {
              a.classList.toggle('active', a.getAttribute('href') === '#' + id);
            });
          }
        });
      }, { root: null, threshold: 0.25, rootMargin: '0px 0px -55% 0px' });

      sections.forEach(sec => io.observe(sec));
    })();
    </script>
<script>
// 管理员面板逻辑（独立脚本块）
(() => {
  // 新版管理UI存在时，跳过旧版面板逻辑，避免重复绑定与报错
  if (document.getElementById('requirementsSection')) {
    return;
  }
  const adminLoginBtn = document.getElementById('adminLoginBtn');
  const adminRequirementsBody = document.getElementById('adminRequirementsBody');
  const applyAllBtn = document.getElementById('applyAllBtn');
  let adminKey = '';

  if (adminLoginBtn) {
    adminLoginBtn.addEventListener('click', async () => {
      adminKey = document.getElementById('adminKeyInput').value.trim();
      if (!adminKey) { alert('请输入管理员密钥'); return; }
      try {
        const resp = await window.apiFetch('/api/admin/requirements', { headers: { 'X-Admin-Key': adminKey } });
        const data = await resp.json();
        if (!resp.ok) throw new Error((data.error || '加载失败') + (data.detail ? ('：' + data.detail) : ''));
                    const items = data.items || [];
                    window.adminItems = items;
                    const renderAdminRows = (list) => {
                      adminRequirementsBody.innerHTML = list.map(item => `
                        <tr data-id="${item.RequirementID}">
                            <td>${item.RequirementID}</td>
                            <td class="text-truncate" style="max-width:160px;" title="${item.Title || ''}">${item.Title || ''}</td>
                            <td>${item.Status || ''}</td>
                            <td>${item.Progress || ''}</td>
                            <td>
                                <select class="form-select form-select-sm allow-open-select">
                                    <option value="true" ${item.AllowOpenQuotes ? 'selected' : ''}>开启</option>
                                    <option value="false" ${!item.AllowOpenQuotes ? 'selected' : ''}>关闭</option>
                                </select>
                            </td>
                            <td>
                                <select class="form-select form-select-sm contact-public-select">
                                    <option value="true" ${item.ContactPublic ? 'selected' : ''}>公开（脱敏）</option>
                                    <option value="false" ${!item.ContactPublic ? 'selected' : ''}>不公开</option>
                                </select>
                            </td>
                            <td><input type="text" class="form-control form-control-sm plain-pw" value="${item.ViewPasswordPlain || ''}" placeholder="明文密码"></td>
                            <td class="small text-muted">${(item.ViewPasswordHash || '').slice(0, 12)}...</td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary" onclick="updateRequirementRow(this)">更新当前</button>
                            </td>
                        </tr>
                    `).join('');
                    };
                    const adminSearchInput = document.getElementById('adminSearchInput');
                    const onlyOpenAdmin = document.getElementById('onlyOpenAdmin');
                    const onlyMaskedAdmin = document.getElementById('onlyMaskedAdmin');
                    const adminStatusFilter = document.getElementById('adminStatusFilter');
                    const adminProgressFilter = document.getElementById('adminProgressFilter');
                    // 恢复筛选持久化
                    try {
                      const saved = JSON.parse(localStorage.getItem('adminFilters')||'{}');
                      if (saved.search && adminSearchInput) adminSearchInput.value = saved.search;
                      if (typeof saved.onlyOpen==='boolean' && onlyOpenAdmin) onlyOpenAdmin.checked = saved.onlyOpen;
                      if (typeof saved.onlyMasked==='boolean' && onlyMaskedAdmin) onlyMaskedAdmin.checked = saved.onlyMasked;
                      if (saved.status) adminStatusFilter.value = saved.status;
                      if (saved.progress) adminProgressFilter.value = saved.progress;
                    } catch {}
                    const applyAdminFilter = () => {
                      const q = (adminSearchInput?.value || '').trim().toLowerCase();
                      const onlyOpen = !!onlyOpenAdmin?.checked;
                      const onlyMasked = !!onlyMaskedAdmin?.checked;
                      const statusSel = adminStatusFilter?.value || '';
                      const progressSel = adminProgressFilter?.value || '';
                      const filtered = (window.adminItems||[]).filter(it => {
                        const id = (it.RequirementID || '').toLowerCase();
                        const title = (it.Title || '').toLowerCase();
                        const matchText = !q || id.includes(q) || title.includes(q);
                        const matchOpen = !onlyOpen || !!it.AllowOpenQuotes;
                        const matchMasked = !onlyMasked || !!it.ContactPublic;
                        const matchStatus = !statusSel || (it.Status || '') === statusSel;
                        const matchProgress = !progressSel || (it.Progress || '') === progressSel;
                        return matchText && matchOpen && matchMasked && matchStatus && matchProgress;
                      });
                      renderAdminRows(filtered);
                    };
                    const persistFilters = () => {
                      try {
                        localStorage.setItem('adminFilters', JSON.stringify({
                          search: adminSearchInput?.value || '',
                          onlyOpen: !!onlyOpenAdmin?.checked,
                          onlyMasked: !!onlyMaskedAdmin?.checked,
                          status: adminStatusFilter?.value || '',
                          progress: adminProgressFilter?.value || ''
                        }));
                      } catch {}
                    };
                    adminSearchInput?.addEventListener('input', () => { persistFilters(); applyAdminFilter(); });
                    onlyOpenAdmin?.addEventListener('change', () => { persistFilters(); applyAdminFilter(); });
                    onlyMaskedAdmin?.addEventListener('change', () => { persistFilters(); applyAdminFilter(); });
                    adminStatusFilter?.addEventListener('change', () => { persistFilters(); applyAdminFilter(); });
                    adminProgressFilter?.addEventListener('change', () => { persistFilters(); applyAdminFilter(); });
                    renderAdminRows(items);
      } catch (e) {
        alert(e.message || '管理员接口调用失败');
      }
    });
  }

  if (applyAllBtn) {
    applyAllBtn.addEventListener('click', async () => {
      if (!adminKey) { alert('请先输入管理员密钥并加载管理面板'); return; }
      const pw = document.getElementById('globalPasswordInput').value.trim();
                const allowSel = document.getElementById('globalAllowOpenQuotes').value;
                const contactSel = document.getElementById('globalContactPublic')?.value || '';
                const payload = { applyToAll: true };
                if (pw) payload.newPasswordPlain = pw;
                if (allowSel === 'true') payload.allowOpenQuotes = true;
                if (allowSel === 'false') payload.allowOpenQuotes = false;
                if (contactSel === 'true') payload.contactPublic = true;
                if (contactSel === 'false') payload.contactPublic = false;
      try {
        const resp = await window.apiFetch('/api/admin/requirements', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || '更新失败');
        alert(`已更新 ${data.updated} 条需求`);
      } catch (e) {
        alert(e.message);
      }
    });
  }
})();

// 单条更新函数（暴露到全局以供按钮调用）
async function updateRequirementRow(btn) {
  const tr = btn.closest('tr');
  const reqId = tr?.dataset?.id || '';
  const plainPw = tr?.querySelector('.plain-pw')?.value.trim() || '';
  const allowOpen = tr?.querySelector('.allow-open-select')?.value === 'true';
  const adminKey = document.getElementById('adminKeyInput').value.trim();
  if (!reqId || !adminKey) { alert('请确保需求编号与管理员密钥有效'); return; }
  const payload = { requirementID: reqId, allowOpenQuotes: allowOpen };
  if (plainPw) payload.newPasswordPlain = plainPw;
  try {
    const resp = await window.apiFetch('/api/admin/requirements', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || '更新失败');
    alert('已更新当前需求设置');
  } catch (e) {
    alert(e.message);
  }
}
</script>

<script>
// 系统设置：与后端 SystemConfig 联动
document.addEventListener('DOMContentLoaded', () => {
  const exportCsvBtn = document.getElementById('exportCsvBtn');
  const exportXlsxBtn = document.getElementById('exportXlsxBtn');
  const defaultExportFormat = document.getElementById('defaultExportFormat');
  const defaultMaskedFilter = document.getElementById('defaultMaskedFilter');
  const notifyEmail = document.getElementById('notifyEmail');
  const notifySms = document.getElementById('notifySms');
  const saveBtn = document.getElementById('saveAdminSettings');
  const hint = document.getElementById('saveSettingsHint');

  function applySettingsToUI(s){
    if (!s) return;
    if (defaultExportFormat) defaultExportFormat.value = s.DefaultExportFormat || s.defaultExportFormat || 'csv';
    if (typeof s.DefaultMaskedFilter !== 'undefined' && defaultMaskedFilter) defaultMaskedFilter.checked = !!s.DefaultMaskedFilter;
    if (typeof s.NotifyEmailEnabled !== 'undefined' && notifyEmail) notifyEmail.checked = !!s.NotifyEmailEnabled;
    if (typeof s.NotifySmsEnabled !== 'undefined' && notifySms) notifySms.checked = !!s.NotifySmsEnabled;
    // 导出按钮高亮切换
    if (exportCsvBtn && exportXlsxBtn) {
      const useCsv = (defaultExportFormat.value || 'csv') === 'csv';
      exportCsvBtn.classList.toggle('btn-primary', useCsv);
      exportCsvBtn.classList.toggle('btn-outline-primary', !useCsv);
      exportXlsxBtn.classList.toggle('btn-outline-success', useCsv);
    }
    // 默认启用“仅联系方式脱敏”筛选
    try {
      const onlyMaskedAdmin = document.getElementById('onlyMaskedAdmin');
      if (onlyMaskedAdmin && typeof s.DefaultMaskedFilter === 'boolean') {
        onlyMaskedAdmin.checked = s.DefaultMaskedFilter;
        onlyMaskedAdmin.dispatchEvent(new Event('change'));
      }
    } catch {}
  }

  async function loadSystemConfig() {
    const key = document.getElementById('adminKeyInput')?.value.trim();
    if (!key) return;
    try {
      const resp = await window.apiFetch('/api/admin/system-config', { headers: { 'X-Admin-Key': key } });
      const data = await resp.json();
      if (resp.ok && data && data.config) {
        applySettingsToUI(data.config);
      }
    } catch {}
  }

  // 在“加载管理”后加载一次系统配置
  document.getElementById('adminLoginBtn')?.addEventListener('click', () => {
    setTimeout(loadSystemConfig, 300);
  });

  saveBtn?.addEventListener('click', async () => {
    const key = document.getElementById('adminKeyInput')?.value.trim();
    if (!key) { alert('请先输入管理员密钥并点击“加载管理”'); return; }
    const payload = {
      SupplierGlobalPassword: document.getElementById('supplierGlobalPasswordInput')?.value || '',
      DefaultExportFormat: defaultExportFormat?.value || 'csv',
      DefaultMaskedFilter: !!defaultMaskedFilter?.checked,
      NotifyEmailEnabled: !!notifyEmail?.checked,
      NotifySmsEnabled: !!notifySms?.checked,
    };
    try {
      const resp = await window.apiFetch('/api/admin/system-config', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key },
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || '保存失败');
      hint.textContent = '已保存';
      setTimeout(() => { hint.textContent = ''; }, 1500);
    } catch (e) {
      alert(e.message || '保存失败');
    }
  });
});
</script>
<script>
// 管理页新逻辑：登录、侧边切换、需求列表、需求方与供应商
(() => {
  let ADMIN_KEY = '';
  let reqOffsetNext = '';
  let reqOffsetStack = [];
  let requirementsCache = [];

  function escapeHtml(s){return String(s).replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;' }[m]));}

  // 侧边/抽屉菜单切换（兼容左侧栏与 offcanvas）
  const bindTabSwitch = (rootSel) => {
    document.querySelectorAll(`${rootSel} .nav-link`).forEach(a => a.addEventListener('click', (e)=>{
      e.preventDefault();
      const tab=a.dataset.tab;
      ['requirementsSection','demandersSection','suppliersSection'].forEach(id => {
        const el=document.getElementById(id);
        if (el) el.style.display = (id===tab) ? '' : 'none';
      });
      document.querySelectorAll(`${rootSel} .nav-link`).forEach(b => b.classList.toggle('active', b===a));
    }));
  };
  bindTabSwitch('aside');
  bindTabSwitch('#adminOffcanvas');
  // 初始激活需求列表
  document.querySelectorAll('aside .nav-link, #adminOffcanvas .nav-link').forEach(a => a.classList.toggle('active', a.dataset.tab==='requirementsSection'));
  const reqSec=document.getElementById('requirementsSection');
  const demSec=document.getElementById('demandersSection');
  const supSec=document.getElementById('suppliersSection');
  if (reqSec) reqSec.style.display='';
  if (demSec) demSec.style.display='none';
  if (supSec) supSec.style.display='none';

  // 登录
  const adminLoginBtn = document.getElementById('adminLoginBtn');
  adminLoginBtn?.addEventListener('click', async () => {
    const key = document.getElementById('adminKeyInput')?.value.trim();
    if (!key) { alert('请输入管理员密钥'); return; }
    try {
      const resp = await window.apiFetch('/api/admin/requirements?limit=1', { headers: { 'X-Admin-Key': key } });
      const text = await resp.text();
      let data;
      try { data = JSON.parse(text); } catch {
        throw new Error('管理员接口不可用或返回非JSON，请检查 Cloudflare Workers/D1 部署或本地 dev 环境。');
      }
      if (!resp.ok) throw new Error((data.error || '验证失败') + (data.detail ? ('：' + data.detail) : ''));
      ADMIN_KEY = key;
      const welcomeScreen = document.getElementById('welcomeScreen');
      const adminApp = document.getElementById('adminApp');
      if (welcomeScreen) welcomeScreen.style.display='none';
      if (adminApp) adminApp.style.display='block';
      // 隐藏旧版块，避免视觉冲突
      try { const legacy = document.getElementById('requirements')?.closest('.row'); if (legacy) legacy.style.display = 'none'; } catch {}
      await loadRequirementsPage(true);
      // 预加载供应商
      loadSuppliers();
    } catch (e) {
      alert(e.message || '管理员验证失败');
    }
  });

  // 需求列表加载
  async function loadRequirementsPage(initial=false){
    const tbody = document.getElementById('reqTableBody');
    const pageHint = document.getElementById('reqPageHint');
    if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="text-muted">加载中...</td></tr>';
    const q = document.getElementById('reqSearchInput')?.value.trim() || '';
    const statusSel = document.getElementById('reqStatusFilter')?.value || '';
    const openSel = document.getElementById('reqOpenFilter')?.value || '';
    const contactSel = document.getElementById('reqContactFilter')?.value || '';
    const params = new URLSearchParams();
    if (q) params.set('q', q);
    if (statusSel) params.set('status', statusSel);
    if (openSel) params.set('open', openSel);
    if (contactSel) params.set('contact', contactSel);
    params.set('limit', '20');
    if (!initial && reqOffsetNext) params.set('offset', reqOffsetNext);
    try {
      const resp = await window.apiFetch(`/api/admin/requirements?${params.toString()}`, { headers: { 'X-Admin-Key': ADMIN_KEY } });
      const text = await resp.text();
      let data;
      try { data = JSON.parse(text); } catch { throw new Error('管理员接口不可用或返回非JSON，请启动函数服务'); }
      if (!resp.ok) throw new Error(data.error || '加载失败');
      const items = data.items || [];
      reqOffsetNext = data.offsetNext || '';
      if (initial) { reqOffsetStack = []; }
      requirementsCache = items;
      renderRequirements(items);
      updateStats(items);
      const prevBtn = document.getElementById('reqPrevPage');
      const nextBtn = document.getElementById('reqNextPage');
      if (prevBtn) prevBtn.disabled = reqOffsetStack.length === 0;
      if (nextBtn) nextBtn.disabled = !reqOffsetNext;
      if (pageHint) pageHint.textContent = `当前页：${items.length} 条，${reqOffsetNext ? '可下一页' : '无更多'}`;
    } catch (e) {
      if (tbody) tbody.innerHTML = `<tr><td colspan="7" class="text-danger">${e.message}</td></tr>`;
    }
  }

  function renderRequirements(list){
    const tbody=document.getElementById('reqTableBody');
    if (!tbody) return;
    tbody.innerHTML = list.map(item => {
      const isPublic = !!item.PublishedAt || (item.Status === '公开');
      const online = !!item.AllowOpenQuotes;
      const contactP = !!item.ContactPublic;
      return `<tr data-id="${item.RequirementID}">
        <td>${item.RequirementID}</td>
        <td class="text-truncate" title="${escapeHtml(item.Title||'')}">${escapeHtml(item.Title||'')}</td>
        <td>${item.Status||''}</td>
        <td>${online ? '开启' : '关闭'}</td>
        <td>${contactP ? '公开' : '不公开'}</td>
        <td data-qcount="loading">—</td>
        <td>
          <button class="btn btn-sm btn-outline-primary me-1" data-action="detail">详情</button>
          <button class="btn btn-sm btn-outline-secondary" data-action="quotes">报价</button>
        </td>
      </tr>`;
    }).join('');
    tbody.querySelectorAll('tr').forEach(tr => {
      const id=tr.dataset.id;
      loadQuoteCount(id, tr);
      tr.querySelector('[data-action="detail"]')?.addEventListener('click', ()=>showRequirementDetail(id));
      tr.querySelector('[data-action="quotes"]')?.addEventListener('click', ()=>showQuotesModal(id));
    });
  }

  async function loadQuoteCount(reqId, tr){
    try{
      const resp = await window.apiFetch(`/api/quotes?requirement_id=${encodeURIComponent(reqId)}`, { headers: { 'X-Admin-Key': ADMIN_KEY } });
      const data = await resp.json();
      const n = Array.isArray(data) ? data.length : ((data.items||[]).length);
      const cell = tr.querySelector('[data-qcount]'); if(cell) cell.textContent = String(n);
    } catch{
      const cell = tr.querySelector('[data-qcount]'); if(cell) cell.textContent = '0';
    }
  }

  function updateStats(items){
    try {
      const container = document.getElementById('adminStats') || (()=>{
        const c=document.createElement('div');
        c.id='adminStats';
        c.className='mb-3 d-flex gap-3 flex-wrap';
        const parent=document.querySelector('#requirementsSection .card-body');
        parent.insertBefore(c, parent.querySelector('.d-flex.flex-wrap'));
        return c;
      })();
      const total=items.length;
      const openCount = items.filter(x=>x.AllowOpenQuotes).length;
      const publicCount = items.filter(x=>x.PublishedAt || x.Status==='公开').length;
      container.innerHTML = `<div class="badge bg-primary">需求总数 ${total}</div><div class="badge bg-success">在线报价开启 ${openCount}</div><div class="badge bg-info text-dark">公开需求 ${publicCount}</div>`;
    } catch{}
  }

  function ensureDetailModal(){
    let m=document.getElementById('reqDetailModal');
    if(m) return m;
    m=document.createElement('div');
    m.id='reqDetailModal';
    m.className='modal fade';
    m.innerHTML = `<div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">需求详情</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button></div></div></div>`;
    document.body.appendChild(m);
    return m;
  }

  function showRequirementDetail(id){
    const item = (requirementsCache||[]).find(x=>x.RequirementID===id);
    if(!item) return;
    const modal = ensureDetailModal();
    modal.querySelector('.modal-title').textContent = `需求 ${item.RequirementID}`;
    modal.querySelector('.modal-body').innerHTML = `<div class="row"><div class="col-md-6"><div>标题：${escapeHtml(item.Title||'')}</div><div>状态：${item.Status||''}</div><div>进度：${item.Progress||''}</div><div>在线报价：${item.AllowOpenQuotes?'开启':'关闭'}</div><div>联系方式公开：${item.ContactPublic?'公开':'不公开'}</div></div><div class="col-md-6"><div>公司：${escapeHtml(item.ContactCompany||'')}</div><div>联系人：${escapeHtml(item.ContactName||'')}</div><div>电话：${escapeHtml(item.ContactPhone||'')}</div><div>明文密码：${escapeHtml(item.ViewPasswordPlain||'')}</div><div>哈希：${escapeHtml((item.ViewPasswordHash||'').slice(0,12))}...</div><div>发布时间：${item.PublishedAt||''}</div></div></div>`;
    new bootstrap.Modal(modal).show();
  }

  function ensureQuotesModal(){
    let m=document.getElementById('quotesModal');
    if(m) return m;
    m=document.createElement('div');
    m.id='quotesModal';
    m.className='modal fade';
    m.innerHTML = `<div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">报价列表</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="table-responsive"><table class="table table-sm"><thead><tr><th>供应商</th><th>联系人</th><th>电话</th><th>报价(元)</th><th>状态</th></tr></thead><tbody id="quotesModalBody"></tbody></table></div></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button></div></div></div>`;
    document.body.appendChild(m);
    return m;
  }

  async function showQuotesModal(id){
    const modal = ensureQuotesModal();
    modal.querySelector('.modal-title').textContent = `报价列表 - ${id}`;
    const body = modal.querySelector('#quotesModalBody');
    body.innerHTML = '<tr><td colspan="5" class="text-muted">加载中...</td></tr>';
    try {
      const resp = await window.apiFetch(`/api/quotes?requirement_id=${encodeURIComponent(id)}`, { headers: { 'X-Admin-Key': ADMIN_KEY } });
      const text = await resp.text();
      let data; try { data = JSON.parse(text); } catch { data = { items: [] }; }
      const items = Array.isArray(data) ? data : (data.items || []);
      body.innerHTML = items.map(q => `<tr><td>${escapeHtml(q.SupplierCompanyName||q.supplier_name||'')}</td><td>${escapeHtml(q.SupplierContact||'')}</td><td>${escapeHtml(q.SupplierPhone||q.supplier_phone||'')}</td><td>${escapeHtml(q.Price||q.amount||'')}</td><td>${escapeHtml(q.Status||q.status||'')}</td></tr>`).join('') || '<tr><td colspan="5" class="text-muted">暂无报价</td></tr>';
    } catch {
      body.innerHTML = '<tr><td colspan="5" class="text-danger">无法加载报价列表</td></tr>';
    }
    new bootstrap.Modal(modal).show();
  }

  document.getElementById('reqApplyFilter')?.addEventListener('click', ()=>{ reqOffsetNext=''; reqOffsetStack=[]; loadRequirementsPage(true); });
  document.getElementById('reqPrevPage')?.addEventListener('click', ()=>{ reqOffsetNext=''; reqOffsetStack=[]; loadRequirementsPage(true); });
  document.getElementById('reqNextPage')?.addEventListener('click', async ()=>{ if(!reqOffsetNext) return; reqOffsetStack.push(reqOffsetNext); await loadRequirementsPage(false); });

  // 需求方统计
  function aggregateDemanders(items){
    const map=new Map();
    items.forEach(it=>{
      const company=(it.ContactCompany||'未留公司').trim();
      const rec=map.get(company) || { company, contact: it.ContactName || '', phone: it.ContactPhone || '', count:0, public:false, needPw:false };
      rec.count++;
      rec.public = rec.public || !!it.ContactPublic;
      rec.needPw = rec.needPw || !it.AllowOpenQuotes;
      rec.contact = rec.contact || it.ContactName || '';
      rec.phone = rec.phone || it.ContactPhone || '';
      map.set(company, rec);
    });
    return Array.from(map.values()).sort((a,b)=> b.count - a.count);
  }
  function renderDemanders(items){
    const body=document.getElementById('demTableBody'); if (!body) return;
    const stats=aggregateDemanders(items);
    const query=(document.getElementById('demSearchInput')?.value || '').trim().toLowerCase();
    const list = stats.filter(d=> !query || (d.company.toLowerCase().includes(query) || d.contact.toLowerCase().includes(query)));
    body.innerHTML = list.map(d => `<tr><td>${escapeHtml(d.company)}</td><td>${escapeHtml(d.contact)}</td><td>${escapeHtml(d.phone)}</td><td>${d.count}</td><td>${d.public?'公开':'不公开'}</td><td>${d.needPw?'需要':'不需要'}</td><td><button class="btn btn-sm btn-outline-primary" data-company="${escapeHtml(d.company)}" data-action="viewDem">查看需求</button></td></tr>`).join('');
    body.querySelectorAll('button[data-action="viewDem"]').forEach(btn => {
      btn.addEventListener('click', ()=>{
        const company = btn.getAttribute('data-company');
        const rel = items.filter(x=> (x.ContactCompany||'') === company);
        showDemandList(company, rel);
      });
    });
  }
  function showDemandList(company, list){
    const modal = ensureDetailModal();
    modal.querySelector('.modal-title').textContent = `需求方：${company}`;
    modal.querySelector('.modal-body').innerHTML = `<ul class="list-group">${list.map(it=>`<li class="list-group-item d-flex justify-content-between align-items-center"><span class="text-truncate" style="max-width:60%;">${escapeHtml(it.Title||it.RequirementID||'未命名')}</span><span class="small text-muted">${it.RequirementID}</span><div><button class="btn btn-sm btn-outline-secondary me-1" onclick="window.location.href='/quotes.html?RequirementID=${encodeURIComponent(it.RequirementID)}'">报价</button><button class="btn btn-sm btn-outline-primary" onclick="(${showRequirementDetail.toString()})('${it.RequirementID}')">详情</button></div></li>`).join('')}</ul>`;
    new bootstrap.Modal(modal).show();
  }
  // 改为从管理接口拉取需求方列表
  document.getElementById('demSearchInput')?.addEventListener('input', ()=>loadDemandersIndex(true));
  document.getElementById('demReloadAll')?.addEventListener('click', ()=>loadDemandersIndex(true));

  // 供应商索引
  let suppliersCache=[];
  let supOffsetNext='';
  let supOffsetStack=[];
  async function loadSuppliers(initial=false){
    try{
      // 优先从管理接口加载；失败时回退至站点索引 JSON
      let ok=false;
      try{
        const urlObj = new URL('/api/admin/suppliers', window.location.origin);
        const onlyPublic = !!document.getElementById('supPublicOnly')?.checked;
        const search = (document.getElementById('supSearchInput')?.value||'').trim();
        if (onlyPublic) urlObj.searchParams.set('public','true');
        if (search) urlObj.searchParams.set('q', search);
        urlObj.searchParams.set('limit','20');
        if (!initial && supOffsetNext) urlObj.searchParams.set('offset', supOffsetNext);
        const respApi = await window.apiFetch(`/api/admin/suppliers?${urlObj.searchParams.toString()}`, { headers: { 'X-Admin-Key': (typeof ADMIN_KEY!=='undefined'?ADMIN_KEY:'') } });
        if (respApi.ok) {
          const d = await respApi.json();
          const items = Array.isArray(d) ? d : (d.items||[]);
          suppliersCache = items.map(it => ({
            title: it.company || it.CompanyName || it.Title || '',
            contact: it.name || it.ContactName || it.Contact || '',
            phone: it.contact_phone || it.Phone || '',
            email: it.contact_email || it.Email || '',
            series: 0,
            models: 0,
            uri: (it.metadata_json && (typeof it.metadata_json==='object' ? it.metadata_json.website : '')) || it.Website || it.Uri || ''
          }));
          supOffsetNext = d.offsetNext || '';
          if (initial) supOffsetStack = [];
          ok=true;
        }
      } catch {}
      if (!ok) {
        const resp = await fetch('/search-index.json');
        if(!resp.ok) throw new Error('无法加载供应商索引');
        const data = await resp.json();
        const pages = (Array.isArray(data) ? data : (data.pages || data)) || [];
        const list = pages.filter(p => (p.type || p.section) && ((p.type||'')==='suppliers' || (p.section||'')==='suppliers'));
        suppliersCache = list.map(p => ({
          title: p.title || '',
          contact: (p.params&&p.params.contact_person) || '',
          phone: (p.params&&p.params.phone) || '',
          email: (p.params&&p.params.email) || '',
          series: Array.isArray(p.params?.series) ? p.params.series.length : 0,
          models: Array.isArray(p.params?.models) ? p.params.models.length : 0,
          uri: p.uri || p.permalink || ''
        }));
      }
      renderSuppliers();
      const pageInfo=document.getElementById('supPageInfo');
      const prevBtn=document.getElementById('supPrevPage');
      const nextBtn=document.getElementById('supNextPage');
      if (pageInfo) pageInfo.textContent = `当前页：${suppliersCache.length} 条，${supOffsetNext ? '可下一页' : '无更多'}`;
      if (prevBtn) prevBtn.disabled = supOffsetStack.length === 0;
      if (nextBtn) nextBtn.disabled = !supOffsetNext;
    } catch(e){
      const body=document.getElementById('supTableBody');
      if (body) body.innerHTML = `<tr><td colspan="6" class="text-danger">${e.message}</td></tr>`;
    }
  }
  function renderSuppliers(){
    const body=document.getElementById('supTableBody'); if (!body) return;
    const q=(document.getElementById('supSearchInput')?.value || '').trim().toLowerCase();
    const list = suppliersCache.filter(s => !q || s.title.toLowerCase().includes(q) || String(s.series).includes(q) || String(s.models).includes(q));
    body.innerHTML = list.map(s=>`<tr data-title="${escapeHtml(s.title)}" data-phone="${escapeHtml(s.phone)}" data-email="${escapeHtml(s.email)}" data-uri="${escapeHtml(s.uri||'')}"><td><a href="${s.uri||'#'}" target="_blank">${escapeHtml(s.title)}</a></td><td>${escapeHtml(s.contact)}</td><td>${escapeHtml(s.phone)}</td><td>${escapeHtml(s.email)}</td><td>${s.series + s.models}</td><td><a class="btn btn-sm btn-outline-secondary me-2" href="${s.uri||'#'}" target="_blank">打开</a><button class="btn btn-sm btn-outline-primary" data-action="editSup">编辑</button></td></tr>`).join('');
    body.querySelectorAll('button[data-action="editSup"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const tr=btn.closest('tr');
        const item={ id:'', CompanyName: tr?.dataset.title||'', Title: tr?.dataset.title||'', ContactName: '', Phone: tr?.dataset.phone||'', Email: tr?.dataset.email||'', ContactPublic:false, Password:'', PasswordHash:'', Website: tr?.dataset.uri||'' };
        showSupEditor(item);
      });
    });
  }
  document.getElementById('supSearchInput')?.addEventListener('input', ()=>loadSuppliers(true));
  document.getElementById('supReloadBtn')?.addEventListener('click', ()=>loadSuppliers(true));
  document.getElementById('supPublicOnly')?.addEventListener('change', ()=>loadSuppliers(true));
  document.getElementById('supPrevPage')?.addEventListener('click', ()=>{
    if (supOffsetStack.length){
      supOffsetNext = supOffsetStack.pop();
      loadSuppliers(false);
    }
  });
  document.getElementById('supNextPage')?.addEventListener('click', ()=>{
    if (supOffsetNext){
      supOffsetStack.push(supOffsetNext);
      loadSuppliers(false);
    }
  });

  // 初始化（未登录时默认显示需求列表）
  document.addEventListener('DOMContentLoaded', ()=>{
    try { const legacy = document.getElementById('requirements')?.closest('.row'); if (legacy) legacy.style.display = 'none'; } catch {}
    document.querySelectorAll('aside .nav-link').forEach(a => a.classList.toggle('active', a.dataset.tab==='requirementsSection'));
    const reqSec=document.getElementById('requirementsSection');
    const demSec=document.getElementById('demandersSection');
    const supSec=document.getElementById('suppliersSection');
    if (reqSec) reqSec.style.display='';
    if (demSec) demSec.style.display='none';
    if (supSec) supSec.style.display='none';
    // 默认尝试加载供应商索引（登录前也可浏览）
    loadSuppliers(true);
  });

  // 在侧边菜单切换时触发对应数据加载
  document.querySelectorAll('aside .nav-link, #adminOffcanvas .nav-link').forEach(a => a.addEventListener('click', ()=>{
    const tab=a.dataset.tab;
    if (tab==='requirementsSection') {
      try { loadRequirementsPage(true); } catch {}
    } else if (tab==='demandersSection') {
      try { loadDemandersIndex(true); } catch {}
    } else if (tab==='suppliersSection') {
      try { loadSuppliers(); } catch {}
    }
  }));

  // 供应商管理编辑器
  function ensureSupEditor(){
    let panel=document.getElementById('supEditorPanel');
    if (!panel){
      panel=document.createElement('div'); panel.id='supEditorPanel'; panel.className='mt-3';
      panel.innerHTML = `
        <div class="border rounded p-3">
          <div class="row g-2">
            <div class="col-md-4"><label class="form-label small">公司/名称</label><input id="supCompany" class="form-control form-control-sm" /></div>
            <div class="col-md-3"><label class="form-label small">联系人</label><input id="supContact" class="form-control form-control-sm" /></div>
            <div class="col-md-3"><label class="form-label small">电话</label><input id="supPhone" class="form-control form-control-sm" /></div>
            <div class="col-md-2"><label class="form-label small">邮箱</label><input id="supEmail" class="form-control form-control-sm" /></div>
            <div class="col-md-4"><label class="form-label small">官网/链接</label><input id="supWebsite" class="form-control form-control-sm" /></div>
            <div class="col-md-3"><div class="form-check mt-2"><input class="form-check-input" type="checkbox" id="supPublic"><label class="form-check-label" for="supPublic">公开联系方式</label></div></div>
            <div class="col-md-3"><label class="form-label small">明文密码</label><input id="supPassword" class="form-control form-control-sm" /></div>
            <div class="col-md-6 d-flex align-items-end justify-content-end gap-2">
              <button id="supSaveBtn" class="btn btn-primary btn-sm">保存</button>
              <button id="supCancelBtn" class="btn btn-secondary btn-sm">取消</button>
              <span id="supSaveHint" class="small text-muted ms-2"></span>
            </div>
          </div>
        </div>`;
      const sec=document.getElementById('suppliersSection'); sec?.querySelector('.card-body')?.appendChild(panel);
    }
    return panel;
  }
  function showSupEditor(item){
    const panel=ensureSupEditor();
    panel.dataset.id = item.id||'';
    document.getElementById('supCompany').value = item.CompanyName || item.Title || '';
    document.getElementById('supContact').value = item.ContactName || '';
    document.getElementById('supPhone').value = item.Phone || '';
    document.getElementById('supEmail').value = item.Email || '';
    document.getElementById('supWebsite').value = item.Website || '';
    document.getElementById('supPublic').checked = !!item.ContactPublic;
    document.getElementById('supPassword').value = item.Password || '';
  }
  document.addEventListener('click', async (e)=>{
    const saveBtn = (e.target && e.target.id === 'supSaveBtn') ? e.target : null;
    const cancelBtn = (e.target && e.target.id === 'supCancelBtn') ? e.target : null;
    if (saveBtn){
      const hint=document.getElementById('supSaveHint');
      const panel=document.getElementById('supEditorPanel'); const id=panel?.dataset.id||'';
      const payload={
        name: document.getElementById('supContact').value.trim(),
        company: document.getElementById('supCompany').value.trim(),
        contact_phone: document.getElementById('supPhone').value.trim(),
        contact_email: document.getElementById('supEmail').value.trim(),
        access_password_plain: document.getElementById('supPassword').value,
        status: 'active',
        metadata_json: {
          contact_public: !!document.getElementById('supPublic').checked,
          website: document.getElementById('supWebsite').value.trim()
        }
      };
      try{
        const resp=await window.apiFetch(`/api/admin/suppliers/${encodeURIComponent(id)}`, { method:'PATCH', headers:{ 'Content-Type':'application/json','X-Admin-Key': (typeof ADMIN_KEY!=='undefined'?ADMIN_KEY:'') }, body: JSON.stringify(payload) });
        const data=await resp.json();
        if(!resp.ok) throw new Error(data.error||'保存失败');
        hint.textContent='已保存';
        await loadSuppliers();
        setTimeout(()=>{hint.textContent='';},1200);
      }catch(err){ hint.textContent = err.message||'保存失败'; setTimeout(()=>{hint.textContent='';},2000); }
    } else if (cancelBtn){
      const panel=document.getElementById('supEditorPanel'); if(panel) panel.dataset.id='';
      ['supCompany','supContact','supPhone','supEmail','supWebsite','supPassword'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
      const chk=document.getElementById('supPublic'); if(chk) chk.checked=false;
    }
  });

  // 需求方管理：列表 + 编辑
  let demandersCache=[];
  async function loadDemandersIndex(initial=false){
    const tbody=document.getElementById('demTableBody');
    if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="text-muted">加载中...</td></tr>';
    const q=(document.getElementById('demSearchInput')?.value||'').trim();
    const url=new URL('/api/admin/demanders', window.location.origin);
    if (q) url.searchParams.set('q', q);
    url.searchParams.set('limit','20');
    try{
      const resp=await window.apiFetch(`/api/admin/demanders?${url.searchParams.toString()}`, { headers: { 'X-Admin-Key': (typeof ADMIN_KEY!=='undefined'?ADMIN_KEY:'') } });
      const data=await resp.json();
      if (!resp.ok) throw new Error(data.error||'加载失败');
      const items = Array.isArray(data) ? data : (data.items || []);
      demandersCache = items.map(d => ({
        id: d.demander_id || d.id || '',
        CompanyName: d.company || d.CompanyName || '',
        ContactName: d.name || d.ContactName || '',
        Phone: d.contact_phone || d.Phone || '',
        Email: d.contact_email || d.Email || '',
        ContactPublic: (d.metadata_json && (typeof d.metadata_json==='object' ? !!d.metadata_json.contact_public : false)) || !!d.ContactPublic,
        AllowOpenQuotes: false
      }));
      renderDemandersIndex();
    }catch(e){
      if (tbody) tbody.innerHTML = `<tr><td colspan="7" class="text-danger">${e.message||'无法加载需求方列表'}</td></tr>`;
    }
  }
  function renderDemandersIndex(){
    const body=document.getElementById('demTableBody'); if(!body) return;
    const query=(document.getElementById('demSearchInput')?.value||'').trim().toLowerCase();
    const list=(demandersCache||[]).filter(d=> !query || (String(d.CompanyName||'').toLowerCase().includes(query) || String(d.ContactName||'').toLowerCase().includes(query)));
    body.innerHTML = list.map(d=>`<tr data-id="${escapeHtml(d.id||'')}"><td>${escapeHtml(d.CompanyName||'')}</td><td>${escapeHtml(d.ContactName||'')}</td><td>${escapeHtml(d.Phone||'')}</td><td>${Number(d.RequirementCount||0)}</td><td>${d.ContactPublic?'公开':'不公开'}</td><td>${d.AllowOpenQuotes?'需要':'不需要'}</td><td><button class="btn btn-sm btn-outline-primary" data-action="editDem">编辑</button></td></tr>`).join('') || '<tr><td colspan="7" class="text-muted">暂无数据</td></tr>';
    body.querySelectorAll('button[data-action="editDem"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const tr = btn.closest('tr'); const id=tr?.dataset.id||'';
        const item = (demandersCache||[]).find(x=> String(x.id||'')===String(id));
        showDemEditor(item||{ id:'', CompanyName:'', ContactName:'', Phone:'', Email:'', ContactPublic:false, AllowOpenQuotes:false, Password:'', PasswordHash:'' });
      });
    });
  }
  document.getElementById('demSearchInput')?.addEventListener('input', ()=>loadDemandersIndex(true));
  document.getElementById('demReloadAll')?.addEventListener('click', ()=>loadDemandersIndex(true));

  function ensureDemEditor(){
    let panel=document.getElementById('demEditorPanel');
    if (!panel){
      panel=document.createElement('div'); panel.id='demEditorPanel'; panel.className='mt-3';
      panel.innerHTML = `
        <div class="border rounded p-3">
          <div class="row g-2">
            <div class="col-md-4"><label class="form-label small">公司</label><input id="demCompany" class="form-control form-control-sm" /></div>
            <div class="col-md-3"><label class="form-label small">联系人</label><input id="demContact" class="form-control form-control-sm" /></div>
            <div class="col-md-3"><label class="form-label small">电话</label><input id="demPhone" class="form-control form-control-sm" /></div>
            <div class="col-md-2"><label class="form-label small">邮箱</label><input id="demEmail" class="form-control form-control-sm" /></div>
            <div class="col-md-3"><div class="form-check mt-2"><input class="form-check-input" type="checkbox" id="demPublic"><label class="form-check-label" for="demPublic">公开联系方式</label></div></div>
            <div class="col-md-3"><label class="form-label small">明文密码</label><input id="demPassword" class="form-control form-control-sm" /></div>
            <div class="col-md-6 d-flex align-items-end justify-content-end gap-2">
              <button id="demSaveBtn" class="btn btn-primary btn-sm">保存</button>
              <button id="demCancelBtn" class="btn btn-secondary btn-sm">取消</button>
              <span id="demSaveHint" class="small text-muted ms-2"></span>
            </div>
          </div>
        </div>`;
      const sec=document.getElementById('demandersSection'); sec?.querySelector('.card-body')?.appendChild(panel);
    }
    return panel;
  }
  function showDemEditor(item){
    const panel=ensureDemEditor();
    panel.dataset.id = item.id||'';
    document.getElementById('demCompany').value = item.CompanyName||'';
    document.getElementById('demContact').value = item.ContactName||'';
    document.getElementById('demPhone').value = item.Phone||'';
    document.getElementById('demEmail').value = item.Email||'';
    document.getElementById('demPublic').checked = !!item.ContactPublic;
    document.getElementById('demPassword').value = item.Password||'';
  }
  document.addEventListener('click', async (e)=>{
    const saveBtn = (e.target && e.target.id === 'demSaveBtn') ? e.target : null;
    const cancelBtn = (e.target && e.target.id === 'demCancelBtn') ? e.target : null;
    if (saveBtn){
      const hint=document.getElementById('demSaveHint');
      const panel=document.getElementById('demEditorPanel'); const id=panel?.dataset.id||'';
      const payload={
        name: document.getElementById('demContact').value.trim(),
        company: document.getElementById('demCompany').value.trim(),
        contact_phone: document.getElementById('demPhone').value.trim(),
        contact_email: document.getElementById('demEmail').value.trim(),
        metadata_json: {
          contact_public: !!document.getElementById('demPublic').checked,
          password_plain: document.getElementById('demPassword').value
        }
      };
      try{
        const resp=await window.apiFetch(`/api/admin/demanders/${encodeURIComponent(id)}`, { method:'PATCH', headers:{ 'Content-Type':'application/json','X-Admin-Key': (typeof ADMIN_KEY!=='undefined'?ADMIN_KEY:'') }, body: JSON.stringify(payload) });
        const data=await resp.json();
        if(!resp.ok) throw new Error(data.error||'保存失败');
        hint.textContent='已保存';
        await loadDemandersIndex(true);
        setTimeout(()=>{hint.textContent='';},1200);
      }catch(err){ hint.textContent = err.message||'保存失败'; setTimeout(()=>{hint.textContent='';},2000); }
    } else if (cancelBtn){
      const panel=document.getElementById('demEditorPanel'); if(panel) panel.dataset.id='';
      ['demCompany','demContact','demPhone','demEmail','demPassword'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
      const chk=document.getElementById('demPublic'); if(chk) chk.checked=false;
    }
  });
})();
</script>
