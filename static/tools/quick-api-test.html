<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek API 快速测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding: 2rem; }
        .test-result { 
            background: #e7f3ff; 
            border: 1px solid #b3d9ff; 
            border-radius: 8px; 
            padding: 1rem; 
            margin: 1rem 0; 
            font-family: monospace; 
            white-space: pre-wrap; 
            max-height: 400px; 
            overflow-y: auto; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>OpenRouter AI API 快速测试</h2>
        
        <div class="card">
            <div class="card-body">
                <h5>API密钥状态</h5>
                <p id="apiStatus">检查中...</p>
                
                <div class="mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="simulationMode" onchange="toggleSimulationMode()">
                        <label class="form-check-label" for="simulationMode">
                            启用模拟模式（用于API不可用时）
                        </label>
                    </div>
                </div>

                <button id="testBtn" class="btn btn-primary" onclick="testAPI()">测试API连接</button>
                <button id="generateBtn" class="btn btn-success" onclick="generateContent()">生成测试内容</button>
                
                <div id="result" class="test-result" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="js/openrouter-api.js"></script>
    <script>
        let openRouterAPI;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof OpenRouterAPI !== 'undefined') {
                openRouterAPI = new OpenRouterAPI();
                checkAPIStatus();
            } else {
                document.getElementById('apiStatus').textContent = '❌ OpenRouter API未加载';
            }
        });
        
        function checkAPIStatus() {
            const status = document.getElementById('apiStatus');
            if (openRouterAPI.isConfigured()) {
                status.innerHTML = '✅ OpenRouter API密钥已配置<br>密钥: ' + openRouterAPI.apiKey.substring(0, 15) + '...<br>🚀 支持Claude、GPT-4等多种先进模型';
            } else {
                status.textContent = '⚠️ API密钥未配置，将使用模拟模式';
            }
        }

        function toggleSimulationMode() {
            const checkbox = document.getElementById('simulationMode');
            if (openRouterAPI) {
                openRouterAPI.setSimulationMode(checkbox.checked);
                console.log('模拟模式:', checkbox.checked ? '启用' : '禁用');
            }
        }
        
        async function testAPI() {
            const btn = document.getElementById('testBtn');
            const result = document.getElementById('result');
            
            btn.disabled = true;
            btn.textContent = '测试中...';
            result.style.display = 'block';
            result.textContent = '正在测试API连接...';
            
            try {
                const response = await openRouterAPI.testConnection();
                
                if (response.success) {
                    const modeText = response.isSimulated ? '（模拟模式）' : '（真实API）';
                    result.textContent = `✅ API连接成功！${modeText}\n\n响应内容: ${response.content}\n\n使用模型: ${response.model || 'deepseek-chat'}`;
                } else {
                    result.textContent = `❌ API连接失败！\n\n错误信息: ${response.error}`;
                }
            } catch (error) {
                result.textContent = `❌ 测试失败！\n\n错误: ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.textContent = '测试API连接';
            }
        }
        
        async function generateContent() {
            const btn = document.getElementById('generateBtn');
            const result = document.getElementById('result');
            
            btn.disabled = true;
            btn.textContent = '生成中...';
            result.style.display = 'block';
            result.textContent = '正在生成测试内容...';
            
            try {
                const response = await openRouterAPI.generateExhibitionContent(
                    '2025年中国国际工业内窥镜展览会',
                    '无损检测'
                );
                
                if (response.success) {
                    const modeText = response.isSimulated ? '（模拟模式）' : '（真实API）';
                    result.textContent = `✅ 内容生成成功！${modeText}\n\n${JSON.stringify(response.data, null, 2)}`;
                } else {
                    result.textContent = `❌ 内容生成失败！\n\n错误信息: ${response.error}`;
                }
            } catch (error) {
                result.textContent = `❌ 生成失败！\n\n错误: ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.textContent = '生成测试内容';
            }
        }
    </script>
</body>
</html>
