<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>发布方入口｜我的需求与报价</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background: #f7f7f7; }
      .container-narrow { max-width: 880px; }
      .card + .card { margin-top: 1rem; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .small-muted { color: #6c757d; font-size: .9rem; }
    </style>
  </head>
  <body>
    <div class="container container-narrow py-4">
      <header class="mb-4 d-flex align-items-center justify-content-between">
        <div>
          <h1 class="h4 mb-1">发布方入口</h1>
          <div class="small-muted">仅输入查看密码即可访问对应需求与报价</div>
        </div>
        <div>
          <a href="/" class="btn btn-outline-secondary btn-sm">返回首页</a>
        </div>
      </header>

      <div class="card shadow-sm">
        <div class="card-body">
          <form id="queryForm" class="row g-3">
            <div class="col-12 col-md-8">
              <label class="form-label">发布方密码或查看密码 <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="viewPwd" placeholder="发布方专用密码或单条需求查看密码" required>
            </div>
            <div class="col-12 col-md-4 d-flex align-items-end">
              <button type="submit" class="btn btn-primary w-100">查询我的需求</button>
            </div>
          </form>
          <div id="reqChoiceArea" class="mt-3"></div>
        </div>
      </div>

      <div class="d-flex justify-content-end mt-3">
        <button type="button" id="exportBtn" class="btn btn-outline-secondary btn-sm" disabled>导出报价 CSV</button>
      </div>
      <div id="resultArea" class="mt-2"></div>
    </div>

    <script>
      // 统一 Cloudflare API 基础地址（与管理页一致）：生产同源 /api，本地/其他默认远端，可被 localStorage 覆盖
      (function() {
        const isProd = /(^|\.)visndt\.com$/i.test(location.hostname);
        const defaultRemote = 'https://api.visndt.com';
        let saved = '';
        try { saved = (typeof localStorage !== 'undefined') ? (localStorage.getItem('API_BASE') || '') : ''; } catch {}
        const allowInProd = new Set(['', 'https://api.visndt.com']);
        if (isProd) {
          window.API_BASE = allowInProd.has(saved) ? saved : '';
        } else {
          window.API_BASE = saved || defaultRemote;
        }
        if (location.protocol === 'https:' && /^http:\/\//i.test(window.API_BASE||'')) {
          try { localStorage.removeItem('API_BASE'); } catch {}
          window.API_BASE = isProd ? '' : defaultRemote;
        }
        window.API_BASE = String(window.API_BASE).replace(/\/$/, '');
      })();

      async function apiFetch(path, options = {}) {
        const url = window.API_BASE + path;
        const headers = { 'Content-Type': 'application/json' };
        if (options.headers) Object.assign(headers, options.headers);
        const res = await fetch(url, { ...options, headers });
        if (!res.ok) {
          let errText = await res.text().catch(() => '');
          throw new Error(`HTTP ${res.status}: ${errText || res.statusText}`);
        }
        const ct = res.headers.get('content-type') || '';
        return ct.includes('application/json') ? res.json() : res.text();
      }

      const form = document.getElementById('queryForm');
      const resultArea = document.getElementById('resultArea');
      const exportBtn = document.getElementById('exportBtn');
      const reqChoiceArea = document.getElementById('reqChoiceArea');
      let lastQuotes = [];
      let currentReqId = '';

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        resultArea.innerHTML = '';
        exportBtn.disabled = true;
        lastQuotes = [];
        const viewPwd = document.getElementById('viewPwd').value.trim();
        if (!viewPwd) return;

        const load = (html) => {
          const div = document.createElement('div');
          div.className = 'alert alert-info';
          div.innerHTML = html;
          resultArea.appendChild(div);
        };
        load('正在查询，请稍候…'); reqChoiceArea.innerHTML = '';

        try {
          // 优先使用发布方密码会话
          let session = null;
          try {
            session = await apiFetch(`/api/demanders/session`, { method:'POST', body: JSON.stringify({ password: viewPwd }) });
          } catch {}
          resultArea.innerHTML = '';
          if (session && session.ok && session.demander && session.demander.Company) {
            const company = session.demander.Company;
            const list = await apiFetch(`/api/demanders/requirements?company=${encodeURIComponent(company)}&password=${encodeURIComponent(viewPwd)}`);
            const items = Array.isArray(list?.items) ? list.items : [];
            if (!items.length) {
              const warn = document.createElement('div'); warn.className='alert alert-warning'; warn.textContent='当前发布方暂无需求记录。'; resultArea.appendChild(warn);
              return;
            }
            // 选择或直接加载第一条
            if (items.length === 1) {
              currentReqId = items[0].RequirementID;
              const url = new URL('entry.html', window.location.origin);
              url.searchParams.set('id', currentReqId);
              window.location.href = url.toString();
            } else {
              renderReqChoiceDemander(items, viewPwd);
            }
            return;
          }
          // 回退到查看密码工作流
          const list = await apiFetch(`/api/requirements/by-password?view_password=${encodeURIComponent(viewPwd)}`);
          const items = Array.isArray(list?.items) ? list.items : [];
          if (!items.length) {
            const div = document.createElement('div');
            div.className = 'alert alert-warning';
            div.textContent = '未找到与该密码关联的需求。';
            resultArea.appendChild(div);
            return;
          }
          if (items.length === 1) {
            currentReqId = items[0].RequirementID;
            const url = new URL('entry.html', window.location.origin);
            url.searchParams.set('id', currentReqId);
            window.location.href = url.toString();
          } else {
            renderReqChoice(items, viewPwd);
          }
        } catch (err) {
          resultArea.innerHTML = '';
          const div = document.createElement('div');
          div.className = 'alert alert-danger';
          div.textContent = '查询失败：' + err.message;
          resultArea.appendChild(div);
        }
      });

      async function loadDetailAndQuotes(reqId, viewPwd) {
        const detail = await apiFetch(`/api/requirements/${encodeURIComponent(reqId)}?view_password=${encodeURIComponent(viewPwd)}`);
        const quotes = await apiFetch(`/api/quotes?requirement_id=${encodeURIComponent(reqId)}&view_password=${encodeURIComponent(viewPwd)}`);
        lastQuotes = Array.isArray(quotes) ? quotes : [];
        if (exportBtn) exportBtn.disabled = lastQuotes.length === 0;
        resultArea.innerHTML = '';
        renderDetail(detail);
        renderQuotes(lastQuotes);
      }

      async function loadDetailAndQuotesDemander(reqId, demPwd) {
        const detail = await apiFetch(`/api/requirements/${encodeURIComponent(reqId)}?view_password=&supplier_access_password=&demander_password=${encodeURIComponent(demPwd)}`);
        const quotes = await apiFetch(`/api/quotes?requirement_id=${encodeURIComponent(reqId)}&demander_password=${encodeURIComponent(demPwd)}`);
        lastQuotes = Array.isArray(quotes) ? quotes : [];
        if (exportBtn) exportBtn.disabled = lastQuotes.length === 0;
        resultArea.innerHTML = '';
        renderDetail(detail);
        renderQuotes(lastQuotes);
      }

      function renderReqChoice(items, viewPwd) {
        const card = document.createElement('div');
        card.className = 'card shadow-sm';
        const rows = items.map((it) => `
          <tr>
            <td class="mono">${escapeHtml(it.RequirementID || '')}</td>
            <td>${escapeHtml(it.Title || '')}</td>
            <td>${escapeHtml(it.Status || '')}</td>
            <td><button class="btn btn-outline-primary btn-sm" data-id="${escapeHtml(it.RequirementID || '')}">进入入口</button></td>
          </tr>`).join('');
        card.innerHTML = `
          <div class="card-body">
            <h2 class="h6">该查看密码关联多个需求，请选择：</h2>
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead><tr><th>需求ID</th><th>标题</th><th>状态</th><th>操作</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>`;
        reqChoiceArea.appendChild(card);
        card.querySelectorAll('button[data-id]').forEach(btn => {
          btn.addEventListener('click', async () => {
            currentReqId = btn.getAttribute('data-id') || '';
            const url = new URL('entry.html', window.location.origin);
            url.searchParams.set('id', currentReqId);
            window.location.href = url.toString();
          });
        });
      }

      function renderReqChoiceDemander(items, demPwd) {
        const card = document.createElement('div');
        card.className = 'card shadow-sm';
        const rows = items.map((it) => `
          <tr>
            <td class="mono">${escapeHtml(it.RequirementID || '')}</td>
            <td>${escapeHtml(it.Title || '')}</td>
            <td>${escapeHtml(it.Status || '')}</td>
            <td><button class="btn btn-outline-primary btn-sm" data-id="${escapeHtml(it.RequirementID || '')}">进入入口</button></td>
          </tr>`).join('');
        card.innerHTML = `
          <div class="card-body">
            <h2 class="h6">该发布方关联多个需求，请选择：</h2>
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead><tr><th>需求ID</th><th>标题</th><th>状态</th><th>操作</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>`;
        reqChoiceArea.appendChild(card);
        card.querySelectorAll('button[data-id]').forEach(btn => {
          btn.addEventListener('click', async () => {
            currentReqId = btn.getAttribute('data-id') || '';
            const url = new URL('entry.html', window.location.origin);
            url.searchParams.set('id', currentReqId);
            window.location.href = url.toString();
          });
        });
      }

      function renderDetail(detail) {
        const card = document.createElement('div');
        card.className = 'card shadow-sm';
        card.innerHTML = `
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <h2 class="h5 mb-0">需求详情</h2>
              <span class="badge bg-secondary mono">${detail.RequirementID || ''}</span>
            </div>
            <div class="mt-3">
              <div><strong>标题：</strong>${escapeHtml(detail.Title || '')}</div>
              <div><strong>分类：</strong>${escapeHtml(detail.primaryCategory || '')}</div>
              <div><strong>联系人：</strong>${escapeHtml(detail.contactName || '')}</div>
              <div><strong>电话：</strong><span class="mono">${escapeHtml(detail.contactPhone || '')}</span></div>
            </div>
          </div>`;
        resultArea.appendChild(card);
      }

      function renderQuotes(quotes) {
        const card = document.createElement('div');
        card.className = 'card shadow-sm';
        const rows = quotes.map((q, i) => `
          <tr>
            <td class="mono">${i + 1}</td>
            <td class="mono">${escapeHtml(q.quote_id || '')}</td>
            <td>${escapeHtml(q.supplier_name || q.supplier_id || '')}</td>
            <td>${escapeHtml(q.price ?? q.amount ?? '')}</td>
            <td>${escapeHtml(q.notes ?? q.remarks ?? '')}</td>
            <td class="mono small">${escapeHtml(q.created_at || '')}</td>
          </tr>`).join('');
        card.innerHTML = `
          <div class="card-body">
            <h2 class="h5">报价列表（${quotes.length}）</h2>
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>报价ID</th>
                    <th>供应商</th>
                    <th>报价</th>
                    <th>备注</th>
                    <th>时间</th>
                  </tr>
                </thead>
                <tbody>${rows || '<tr><td colspan="6" class="text-center text-muted">暂无报价</td></tr>'}</tbody>
              </table>
            </div>
          </div>`;
        resultArea.appendChild(card);
      }

      if (exportBtn) {
        exportBtn.addEventListener('click', () => {
          if (!lastQuotes.length) return;
          const headers = ['quote_id','supplier_id','supplier_name','price','notes','created_at'];
          const lines = [headers.join(',')];
          lastQuotes.forEach(q => {
            const row = headers.map(h => {
              if (h === 'price') return escapeCsv(q.price ?? q.amount ?? '');
              if (h === 'notes') return escapeCsv(q.notes ?? q.remarks ?? '');
              return escapeCsv(q[h]);
            });
            lines.push(row.join(','));
          });
          const blob = new Blob(["\ufeff" + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `quotes_${Date.now()}.csv`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
      }

      function escapeHtml(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      }
      function escapeCsv(s) {
        if (s === null || s === undefined) return '';
        s = String(s);
        if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
        return s;
      }
    </script>
  </body>
  </html>
