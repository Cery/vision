<nav class="pv3 ph3 ph4-ns bg-black-90 sticky-top z-5" role="navigation">
  <div class="flex-l center items-center justify-between mw9">
    <a href="{{ .Site.Home.RelPermalink }}" class="f3 fw2 hover-white white-90 dib no-underline flex items-center">
      <img src="/images/logo.png" class="h2 mr2" alt="" onerror="this.style.display='none'">
      <div>
        VisNDT
        <span class="f6 db light-silver tracked">维森 · 视觉检测仪器</span>
      </div>
    </a>
    <div class="flex-l items-center">
      {{ if .Site.Menus.main }}
        <ul class="pl0 mr3 flex items-center mb0 list">
          {{ range .Site.Menus.main }}
          <li class="f5 fw4 dib ph3 relative group">
            <a class="hover-blue white-90 no-underline transition-colors pb2" href="{{ .URL }}">
              {{ .Name }}
            </a>
            <div class="absolute bottom-0 left-0 w-0 h1 bg-blue transition-width group-hover-w-100"></div>
          </li>
          {{ end }}
        </ul>
      {{ end }}
      
      <div class="relative">
        <form action="/search" method="get" class="flex items-center">
          <input type="text" name="q" placeholder="搜索产品..." class="bn bg-white-10 white-90 br-pill ph3 pv2 f6 outline-0 focus-bg-white-20 transition-colors w4 focus-w5">
          <button type="submit" class="bn bg-transparent pointer white-90 ml-2 dim">
            <i class="fas fa-search"></i>
          </button>
        </form>
      </div>
    </div>
  </div>
</nav>
