{{ define "main" }}
<div class="container my-4">
  <div class="card">
    <div class="card-body">
      <h3 class="mb-2">{{ .Params.Title | default .Title }}</h3>
      <p class="text-muted">{{ .Params.PublicPreview }}</p>
      <div class="alert alert-light border d-flex align-items-center gap-2 p-2" id="authHintSingle">
        <i class="fa-solid fa-shield"></i>
        <span class="small text-muted">未授权：请输入供应商通行密码以解锁发布方信息</span>
      </div>
      <div id="privateInfo" style="display:none;">
        <hr>
        <h5 class="mb-3">发布方信息</h5>
        <p>公司：<span id="pub-company"></span></p>
        <p>联系人：<span id="pub-contact"></span></p>
        <p>电话：<span id="pub-phone"></span></p>
      </div>
      <div class="mt-3">
        <button class="btn btn-primary" onclick="requestViewPrivateInfo()">验证供应商密码 / 在线报价</button>
      </div>
    </div>
  </div>
</div>
{{ partial "password-modal.html" . }}
<script>
  window.API_BASE = window.API_BASE || 'https://api.visndt.com';
  window.apiFetch = window.apiFetch || ((path, opts={}) => fetch(`${window.API_BASE}${path}`, opts));
  const requirementID = "{{ .Params.RequirementID }}";
  function requestViewPrivateInfo() {
    if (typeof showPasswordModal !== 'function') { alert('密码组件未加载，请稍后再试'); return; }
    showPasswordModal(async (inputPwd) => {
      try {
        async function fetchDetail(qs){
          let r = await window.apiFetch(`/api/markets/${encodeURIComponent(requirementID)}${qs}`);
          if (!r.ok) r = await window.apiFetch(`/api/requirements/${encodeURIComponent(requirementID)}${qs}`);
          if (!r.ok) throw new Error('密码错误或已过期');
          return r.json();
        }
        const res = await fetchDetail(`?supplier_access_password=${encodeURIComponent(inputPwd)}`).catch(()=>fetchDetail(`?view_password=${encodeURIComponent(inputPwd)}`));
        const det = res.requirement || res;
        document.getElementById('pub-company').textContent = det.ContactCompany || '—';
        document.getElementById('pub-contact').textContent = det.ContactName || '—';
        document.getElementById('pub-phone').textContent = det.ContactPhone || '—';
        document.getElementById('privateInfo').style.display = 'block';
        try { const hint = document.getElementById('authHintSingle'); if (hint) { hint.className = 'alert alert-success d-flex align-items-center gap-2 p-2'; hint.querySelector('span')?.replaceChildren(document.createTextNode('已授权')); } } catch {}
      } catch (e) { console.error(e); alert(e.message || '验证服务暂不可用，请稍后再试'); }
    });
  }
</script>
{{ end }}
