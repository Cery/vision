{{ define "main" }}
<div class="container py-5">
  {{ partial "breadcrumbs.html" . }}
  <div class="text-center mb-4">
    <h1 class="fw-bold">供应商入驻申请</h1>
    <p class="text-muted">请完整填写以下信息，提交后进入审核流程。</p>
  </div>
  <div class="row g-4">
    <div class="col-lg-8">
      <form id="supplierRegisterForm" class="card shadow-sm border-0">
        <div class="card-body p-4">
          <div class="mb-4">
            <h5 class="fw-semibold">企业信息</h5>
            <div class="row g-3 mt-2">
              <div class="col-md-6">
                <label class="form-label">公司全称</label>
                <input type="text" class="form-control" id="companyFull" required placeholder="例如：深圳市某某科技有限公司">
                <div class="form-text" id="companyCheckHint"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label">公司简称</label>
                <input type="text" class="form-control" id="companyShort" placeholder="例如：某某科技">
              </div>
              <div class="col-md-6">
                <label class="form-label">公司地址</label>
                <input type="text" class="form-control" id="companyAddr" placeholder="省市区+详细地址">
              </div>
              <div class="col-md-6">
                <label class="form-label">公司官网</label>
                <input type="url" class="form-control" id="companySite" placeholder="https://example.com">
              </div>
            </div>
          </div>

          <div class="mb-4">
            <h5 class="fw-semibold">联系方式</h5>
            <div class="row g-3 mt-2">
              <div class="col-md-4">
                <label class="form-label">联系人</label>
                <input type="text" class="form-control" id="contactName" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">职位</label>
                <input type="text" class="form-control" id="contactTitle">
              </div>
              <div class="col-md-4">
                <label class="form-label">联系电话</label>
                <input type="text" class="form-control" id="contactPhone" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">电子邮箱</label>
                <input type="email" class="form-control" id="contactEmail" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">供应商通行密码</label>
                <input type="text" class="form-control" id="accessPassword" placeholder="设置后可进入供应商入口">
              </div>
            </div>
          </div>

          <div class="mb-4">
            <h5 class="fw-semibold">产品与能力</h5>
            <div class="row g-3 mt-2">
              <div class="col-12">
                <label class="form-label">产品系列</label>
                <input type="text" class="form-control" id="productSeries" placeholder="例如：电子内窥镜、光纤内窥镜、硬性内窥镜">
              </div>
              <div class="col-12">
                <label class="form-label">核心参数/优势标签</label>
                <input type="text" class="form-control" id="productTags" placeholder="逗号分隔，例如：4mm, LED, 可导向, 工业级">
              </div>
            </div>
          </div>

          <div class="mb-4">
            <h5 class="fw-semibold">企业图库</h5>
            <div class="row g-3 mt-2">
              <div class="col-12">
                <input type="file" class="form-control" id="galleryImages" multiple accept="image/*">
                <div class="form-text">最多选择 6 张，单图不超过 2MB。</div>
              </div>
            </div>
          </div>

          <div class="mb-4">
            <h5 class="fw-semibold">资质审核</h5>
            <div class="row g-3 mt-2">
              <div class="col-12">
                <input type="file" class="form-control" id="qualificationImages" multiple accept="image/*,application/pdf">
                <div class="form-text">上传营业执照、名片或工作证明等，支持图片或 PDF。</div>
              </div>
            </div>
          </div>

          <div class="mb-4">
            <h5 class="fw-semibold">公司介绍</h5>
            <textarea class="form-control" id="companyIntro" rows="5" placeholder="公司概况、生产能力、质量体系、典型客户等"></textarea>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary" id="submitBtn">提交入驻申请</button>
          </div>
        </div>
      </form>
      <div id="submitResult" class="alert d-none mt-3" role="alert"></div>
    </div>
    <div class="col-lg-4">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h5 class="fw-semibold">流程说明</h5>
          <ul class="small mt-2">
            <li>提交后进入审核，预计 1–3 个工作日。</li>
            <li>审核通过后可使用通行密码进入供应商入口。</li>
            <li>支持在管理后台完善资料、上传图片与文档。</li>
          </ul>
          <div class="mt-3">
            <a href="/cooperation/" class="btn btn-outline-secondary w-100">返回商务合作</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
.form-text{font-size:.85rem;color:#6c757d}
.fw-semibold{font-weight:600}
</style>

<script>
(function(){
  const apiBase = (window.API_BASE||'').replace(/\/$/,'') || '';
  function toBase64(file){
    return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(String(r.result||'')); r.onerror=reject; r.readAsDataURL(file); });
  }
  async function collectFiles(input,max){
    const files = Array.from(input.files||[]).slice(0,max||6);
    const out = [];
    for(const f of files){ if(f.size>2*1024*1024) continue; out.push(await toBase64(f)); }
    return out;
  }
  async function checkCompany(name){
    if(!name) return { exists:false };
    const u = (apiBase?apiBase:'') + '/api/suppliers/check-company?name=' + encodeURIComponent(name);
    try{ const r=await fetch(u); if(!r.ok) return { exists:false }; return await r.json(); }catch{ return { exists:false }; }
  }
  document.addEventListener('DOMContentLoaded',function(){
    const companyFull = document.getElementById('companyFull');
    const hint = document.getElementById('companyCheckHint');
    companyFull.addEventListener('blur', async function(){
      const v = this.value.trim();
      hint.textContent='';
      if(!v) return;
      const res = await checkCompany(v);
      if(res.exists){ hint.textContent='该公司已存在，无法重复注册'; hint.className='form-text text-danger'; } else { hint.textContent='可注册'; hint.className='form-text text-success'; }
    });
    document.getElementById('supplierRegisterForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='提交中...';
      const company = companyFull.value.trim();
      const exists = await checkCompany(company);
      if(exists.exists){ btn.disabled=false; btn.textContent='提交入驻申请'; return alert('公司已存在，无法重复注册'); }
      const gallery = await collectFiles(document.getElementById('galleryImages'),6);
      const quals = await collectFiles(document.getElementById('qualificationImages'),6);
      const payload = {
        company: company,
        name: document.getElementById('companyShort').value.trim(),
        contact: {
          name: document.getElementById('contactName').value.trim(),
          title: document.getElementById('contactTitle').value.trim(),
          phone: document.getElementById('contactPhone').value.trim(),
          email: document.getElementById('contactEmail').value.trim()
        },
        address: document.getElementById('companyAddr').value.trim(),
        website: document.getElementById('companySite').value.trim(),
        series: document.getElementById('productSeries').value.trim(),
        tags: document.getElementById('productTags').value.trim(),
        access_password: document.getElementById('accessPassword').value.trim(),
        gallery_images: gallery,
        qualification_images: quals,
        intro: document.getElementById('companyIntro').value.trim()
      };
      try{
        const u = (apiBase?apiBase:'') + '/api/suppliers/register';
        const r = await fetch(u,{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        const j = await r.json();
        const box = document.getElementById('submitResult');
        if(r.ok && j.ok){ box.className='alert alert-success'; box.textContent='提交成功，审核通过后将邮件或电话通知。'; box.classList.remove('d-none'); }
        else { box.className='alert alert-danger'; box.textContent='提交失败：'+(j.error||('HTTP '+r.status)); box.classList.remove('d-none'); }
      }catch(e){ alert('网络异常，请稍后再试'); }
      finally{ btn.disabled=false; btn.textContent='提交入驻申请'; }
    });
  });
})();
</script>
{{ end }}
