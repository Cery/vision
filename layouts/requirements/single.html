{{ define "main" }}
<div class="container my-4">
  <div class="card">
    <div class="card-body">
      <h3 class="mb-2">{{ .Params.Title | default .Title }}</h3>
      <p class="text-muted">{{ .Params.PublicPreview }}</p>
      <div class="alert alert-light border d-flex align-items-center gap-2 p-2" id="authHintSingle">
        <i class="fa-solid fa-shield"></i>
        <span class="small text-muted">未授权：请输入供应商通行密码以解锁发布方信息</span>
      </div>

      <!-- 私密信息区域，初始隐藏 -->
      <div id="privateInfo" style="display:none;">
        <hr>
        <h5 class="mb-3">发布方信息</h5>
        <p>公司：<span id="pub-company"></span></p>
        <p>联系人：<span id="pub-contact"></span></p>
        <p>电话：<span id="pub-phone"></span></p>
      </div>

  <div class="mt-3">
        <button class="btn btn-primary" onclick="requestViewPrivateInfo()">验证供应商密码 / 在线报价</button>
  </div>
    </div>
  </div>
</div>

<!-- 密码模态 -->
{{ partial "password-modal.html" . }}

<script>
  // 统一 API 基础地址（本地与线上）
  window.API_BASE = window.API_BASE || (location.hostname === 'localhost' ? 'http://localhost:8787' : 'https://api.visndt.com');
  window.apiFetch = window.apiFetch || ((path, opts={}) => fetch(`${window.API_BASE}${path}`, opts));
  const requirementID = "{{ .Params.RequirementID }}";

  // 展示密码输入弹窗
  function requestViewPrivateInfo() {
    if (typeof showPasswordModal !== 'function') {
      alert('密码组件未加载，请稍后再试');
      return;
    }
    showPasswordModal(async (inputPwd) => {
      try {
        let resp = await window.apiFetch(`/api/requirements/${encodeURIComponent(requirementID)}?supplier_access_password=${encodeURIComponent(inputPwd)}`);
        let res = null;
        if (resp.ok) {
          res = await resp.json();
        } else {
          resp = await window.apiFetch(`/api/requirements/${encodeURIComponent(requirementID)}?view_password=${encodeURIComponent(inputPwd)}`);
          if (!resp.ok) throw new Error('密码错误或已过期');
          res = await resp.json();
        }
        document.getElementById('pub-company').textContent = res.ContactCompany || '—';
        document.getElementById('pub-contact').textContent = res.ContactName || '—';
        document.getElementById('pub-phone').textContent = res.ContactPhone || '—';
        document.getElementById('privateInfo').style.display = 'block';
        try {
          const hint = document.getElementById('authHintSingle');
          const usedText = (resp && resp.ok) ? '已授权' : '已授权';
          if (hint) { hint.className = 'alert alert-success d-flex align-items-center gap-2 p-2'; hint.querySelector('span')?.replaceChildren(document.createTextNode(usedText)); }
        } catch {}
      } catch (e) {
        console.error(e);
        alert(e.message || '验证服务暂不可用，请稍后再试');
      }
    });
  }
</script>
{{ end }}
