{{ define "main" }}
<div class="container my-4">
  <div class="card">
    <div class="card-body">
      <h3 class="mb-2">{{ .Params.Title | default .Title }}</h3>
      <p class="text-muted">{{ .Params.PublicPreview }}</p>

      <!-- 私密信息区域，初始隐藏 -->
      <div id="privateInfo" style="display:none;">
        <hr>
        <h5 class="mb-3">发布方信息</h5>
        <p>公司：<span id="pub-company"></span></p>
        <p>联系人：<span id="pub-contact"></span></p>
        <p>电话：<span id="pub-phone"></span></p>
      </div>

      <div class="mt-3">
        <button class="btn btn-primary" onclick="requestViewPrivateInfo()">查看完整信息 / 在线报价</button>
      </div>
    </div>
  </div>
</div>

<!-- 密码模态 -->
{{ partial "password-modal.html" . }}

<script>
  // 统一 API 基础地址（本地与线上）
  window.API_BASE = window.API_BASE || (location.hostname === 'localhost' ? 'http://localhost:8787' : 'https://api.visndt.com');
  window.apiFetch = window.apiFetch || ((path, opts={}) => fetch(`${window.API_BASE}${path}`, opts));
  const requirementID = "{{ .Params.RequirementID }}";

  // 展示密码输入弹窗
  function requestViewPrivateInfo() {
    if (typeof showPasswordModal !== 'function') {
      alert('密码组件未加载，请稍后再试');
      return;
    }
    showPasswordModal(async (inputPwd) => {
      try {
        const resp = await window.apiFetch(`/api/requirements/${encodeURIComponent(requirementID)}?view_password=${encodeURIComponent(inputPwd)}`);
        if (!resp.ok) throw new Error('密码错误或已过期');
        const res = await resp.json();
        document.getElementById('pub-company').textContent = res.ContactCompany || '—';
        document.getElementById('pub-contact').textContent = res.ContactName || '—';
        document.getElementById('pub-phone').textContent = res.ContactPhone || '—';
        document.getElementById('privateInfo').style.display = 'block';
      } catch (e) {
        console.error(e);
        alert(e.message || '验证服务暂不可用，请稍后再试');
      }
    });
  }
</script>
{{ end }}
