<div class="card shadow-sm">
  <div class="card-header d-flex align-items-center gap-2">
    <i class="fa-solid fa-clipboard-list text-primary"></i>
    <strong>发布需求</strong>
  </div>
  <div class="card-body">
    <form name="requirement" method="POST" data-netlify="true" id="requirementForm">
      <!-- Netlify 必需的隐藏字段 -->
      <input type="hidden" name="form-name" value="requirement" />
      <!-- 生成的唯一ID -->
      <input type="hidden" id="requirement-id" name="requirementID" value="">
      <!-- 发布方式（公开/在线报价） -->
      <input type="hidden" id="publish-status" name="Status" value="公开">
      <!-- 密码（明文，初期阶段保存在 Netlify 表单；后期在函数中哈希存储） -->
      <input type="hidden" id="view-password" name="viewPassword" value="">

      <!-- 发布标题 -->
      <div class="mb-3">
        <label class="form-label"><i class="fa-solid fa-heading me-1 text-secondary"></i>发布标题</label>
        <input type="text" name="Title" class="form-control" placeholder="发动机缸盖检查电子内窥镜采购需求" required>
      </div>


      <!-- 产品分类（原一级分类） -->
      <div class="mb-3">
        <label class="form-label"><i class="fa-solid fa-tags me-1 text-secondary"></i>产品分类</label>
        <select name="primaryCategory" id="primaryCategory" class="form-select" required onchange="updateCategoryParams()">
          <option value="电子内窥镜">电子内窥镜</option>
          <option value="光纤内窥镜">光纤内窥镜</option>
          <option value="光学内窥镜">光学内窥镜</option>
        </select>
      </div>

      <!-- 二级分类项不展示（按需求） -->

      <!-- 分类参数选项 -->
      <div id="categoryParams" class="mb-3">
        <!-- 电子内窥镜 参数 -->
        <div id="params-electronic" class="card mb-3">
          <div class="card-header d-flex align-items-center gap-2">
            <i class="fa-solid fa-camera text-primary"></i>
            <strong>电子内窥镜参数</strong>
          </div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">主机屏幕</label>
                <input type="text" class="form-control" name="param_screen_size" placeholder="如 7寸 / 10寸">
              </div>
              <div class="col-md-6">
                <label class="form-label">探头直径（mm）</label>
                <input type="text" class="form-control" name="param_probe_diameter" placeholder="如 3.8 / 6.0">
              </div>
              <div class="col-md-6">
                <label class="form-label">长度（mm）</label>
                <input type="text" class="form-control" name="param_working_length" placeholder="如 1000 / 1500 / 3000">
              </div>
              <div class="col-md-6">
                <label class="form-label">像素</label>
                <select class="form-select" name="param_resolution">
                  <option value="">请选择</option>
                  <option>16万</option>
                  <option>30万</option>
                  <option>52万</option>
                  <option>100万</option>
                  <option>200万</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">视向</label>
                <select class="form-select" name="param_viewing_direction">
                  <option value="">请选择</option>
                  <option>0°直视</option>
                  <option>30°斜视</option>
                  <option>70°斜视</option>
                  <option>90°侧视</option>
                  <option>直侧一体</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">视野</label>
                <input type="text" class="form-control" name="param_field_of_view" placeholder="如 70 / 90 / 120">
              </div>
              <div class="col-md-6">
                <label class="form-label">光源类型</label>
                <select class="form-select" name="param_light_source">
                  <option value="">请选择</option>
                  <option>前置LED灯</option>
                  <option>后置LED光纤传导</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">镜头导向</label>
                <select class="form-select" name="param_guidance">
                  <option value="">请选择</option>
                  <option>无导向</option>
                  <option>180°两方向</option>
                  <option>360°四方向</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <!-- 光纤内窥镜 参数 -->
        <div id="params-fiber" class="card mb-3" style="display:none;">
          <div class="card-header d-flex align-items-center gap-2">
            <i class="fa-solid fa-lightbulb text-warning"></i>
            <strong>光纤内窥镜参数</strong>
          </div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">探头直径（mm）</label>
                <input type="text" class="form-control" name="param_probe_diameter" placeholder="如 2.8 / 4.0 / 6.0">
              </div>
              <div class="col-md-6">
                <label class="form-label">长度（mm）</label>
                <input type="text" class="form-control" name="param_working_length" placeholder="如 300 / 1000">
              </div>
              <div class="col-md-6">
                <label class="form-label">视向</label>
                <select class="form-select" name="param_viewing_direction">
                  <option value="">请选择</option>
                  <option>0°直视</option>
                  <option>30°斜视</option>
                  <option>70°斜视</option>
                  <option>90°侧视</option>
                  <option>直侧一体</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">视野</label>
                <input type="text" class="form-control" name="param_field_of_view" placeholder="如 70 / 90 / 120">
              </div>
              <div class="col-md-6">
                <label class="form-label">镜头导向</label>
                <select class="form-select" name="param_guidance">
                  <option value="">请选择</option>
                  <option>无导向</option>
                  <option>180°两方向</option>
                  <option>360°四方向</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <!-- 光学内窥镜 参数 -->
        <div id="params-optic" class="card mb-3" style="display:none;">
          <div class="card-header d-flex align-items-center gap-2">
            <i class="fa-solid fa-microscope text-success"></i>
            <strong>光学内窥镜参数</strong>
          </div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">探头直径（mm）</label>
                <input type="text" class="form-control" name="param_probe_diameter" placeholder="如 2.8 / 4.0 / 6.0">
              </div>
              <div class="col-md-6">
                <label class="form-label">长度（mm）</label>
                <input type="text" class="form-control" name="param_working_length" placeholder="如 300 / 500 / 1000">
              </div>
              <div class="col-md-6">
                <label class="form-label">视向</label>
                <select class="form-select" name="param_viewing_direction">
                  <option value="">请选择</option>
                  <option>0°直视</option>
                  <option>30°斜视</option>
                  <option>70°斜视</option>
                  <option>90°侧视</option>
                  <option>直侧一体</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">视野</label>
                <input type="text" class="form-control" name="param_field_of_view" placeholder="如 60 / 90 / 110">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 详细说明 / 参数 -->
      <div class="mb-3">
        <label class="form-label"><i class="fa-solid fa-list-check me-1 text-secondary"></i>详细说明 / 参数</label>
        <textarea name="parameters" id="parameters" class="form-control" rows="4" placeholder="可留空，系统会根据上方选项生成概要"></textarea>
      </div>

      <!-- 可选补充（折叠） -->
      <div class="card mb-3">
        <div class="card-header d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center gap-2">
            <i class="fa-solid fa-plus text-secondary"></i>
            <strong>可选补充</strong>
          </div>
          <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#optionalSupplement" aria-expanded="false" aria-controls="optionalSupplement">展开/收起</button>
        </div>
        <div id="optionalSupplement" class="collapse">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-12">
                <label class="form-label">工件名称/描述</label>
                <input type="text" class="form-control" name="param_workpiece_name" placeholder="如 发动机缸盖、材质、关键特征">
              </div>
              <div class="col-md-6">
                <label class="form-label">插入孔径（mm）</label>
                <input type="text" class="form-control" name="param_insert_diameter" placeholder="如 6 / 8 / 10">
              </div>
              <div class="col-md-6">
                <label class="form-label">插入深度（mm）</label>
                <input type="text" class="form-control" name="param_insert_depth" placeholder="如 100 / 300 / 500">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 预算与采购计划 -->
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label"><i class="fa-solid fa-coins me-1 text-secondary"></i>预算范围</label>
          <select name="budgetRange" class="form-select" required>
            <option value="0-5千">0-5千</option>
            <option value="5千-5万">5千-5万</option>
            <option value="5万-10万">5万-10万</option>
            <option value="10万+">10万+</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label"><i class="fa-solid fa-clipboard-list me-1 text-secondary"></i>采购计划</label>
          <select name="procurementPlan" class="form-select" required>
            <option value="紧急采购">紧急采购</option>
            <option value="3个月内">3个月内</option>
            <option value="6个月内">6个月内</option>
            <option value="市场调研">市场调研</option>
          </select>
        </div>
      </div>

      <!-- 需求详细说明（已移除重复项，保留上方“详细说明/参数”） -->

      <!-- 发布方信息（移动到底部发布方式上方） -->
      <div class="card mb-3">
        <div class="card-header d-flex align-items-center gap-2">
          <i class="fa-solid fa-id-card text-secondary"></i>
          <strong>发布方信息</strong>
        </div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label"><i class="fa-solid fa-user me-1 text-secondary"></i>联系人</label>
              <input type="text" name="contactName" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label"><i class="fa-solid fa-phone me-1 text-secondary"></i>手机号</label>
              <input type="text" name="contactPhone" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label"><i class="fa-solid fa-building me-1 text-secondary"></i>公司/单位</label>
              <input type="text" name="contactCompany" class="form-control" placeholder="可选">
            </div>
            <div class="col-md-6">
              <label class="form-label"><i class="fa-solid fa-envelope me-1 text-secondary"></i>邮箱</label>
              <input type="email" name="contactEmail" class="form-control" placeholder="可选">
            </div>
            <div class="col-md-6">
              <label class="form-label"><i class="fa-solid fa-users-gear me-1 text-secondary"></i>需求部门</label>
              <input type="text" name="contactDepartment" class="form-control" placeholder="可选">
            </div>
          </div>
        </div>
      </div>

      <!-- 发布方式（底部） -->
      <div class="mb-3 pt-3 border-top">
        <label class="form-label d-block"><i class="fa-solid fa-globe me-1 text-secondary"></i>发布方式</label>
        <div class="btn-group publish-mode-group d-flex justify-content-center" role="group" aria-label="发布方式">
          <input type="radio" class="btn-check" name="publishMode" id="publishPublic" autocomplete="off" checked>
          <label class="btn btn-outline-success" for="publishPublic" onclick="document.getElementById('publish-status').value='公开'">
            <i class="fa-solid fa-unlock me-1"></i> 公开联系方式
          </label>
          <input type="radio" class="btn-check" name="publishMode" id="publishQuote" autocomplete="off">
          <label class="btn btn-outline-warning" for="publishQuote" onclick="document.getElementById('publish-status').value='在线报价'">
            <i class="fa-solid fa-handshake me-1"></i> 接受在线报价
          </label>
        </div>
        <div class="form-text">公开联系方式：供应商输入查看密码后可见。</div>
        <div class="form-text">接受在线报价：联系方式不公开，供应商提交方案即可。</div>
      </div>

      <!-- 编号与密码预览 -->
      <div class="row g-3 mb-3" id="idPreview" style="display:none;">
        <div class="col-md-6">
          <label class="form-label">需求编号</label>
          <input type="text" class="form-control" id="requirement-id-preview" readonly>
        </div>
        <div class="col-md-6">
          <label class="form-label">查看密码</label>
          <input type="text" class="form-control" id="view-password-preview" readonly>
        </div>
      </div>

      <div class="text-center">
        <button type="button" class="btn btn-primary" onclick="generateAndSubmitRequirement()">
          <i class="fa-solid fa-paper-plane me-1"></i> 发布需求
        </button>
      </div>
    </form>
  </div>
</div>

<script>
// 统一 API 基础地址（本地与线上）
(function(){
  const DEFAULT_API_BASE_PROD = 'https://api.visndt.com';
  const DEFAULT_API_BASE_DEV = 'http://127.0.0.1:8787';
  const host = location.hostname;
  const isLocal = host === 'localhost' || host === '127.0.0.1';
  const override = localStorage.getItem('API_BASE');
  window.API_BASE = window.API_BASE || override || (isLocal ? DEFAULT_API_BASE_DEV : DEFAULT_API_BASE_PROD);
  window.apiFetch = window.apiFetch || ((path, opts={}) => fetch(`${window.API_BASE}${path}`, opts));
})();
// 生成简单唯一ID（可替换为更复杂算法）
function generateRequirementID() {
  const date = new Date();
  const ds = date.toISOString().slice(0,10).replace(/-/g,'');
  const rand = Math.floor(Math.random()*9000)+1000;
  return `REQ-${ds}-${rand}`;
}

// 生成查看密码（6位随机）
function generateViewPassword() {
  const chars = 'ABCDEFGHJKMNPQRSTWXYZ23456789';
  let pw = '';
  for (let i=0;i<6;i++) pw += chars.charAt(Math.floor(Math.random()*chars.length));
  return pw;
}

// 根据分类显示参数块
function updateCategoryParams() {
  const cat = document.getElementById('primaryCategory').value;
  document.getElementById('params-electronic').style.display = (cat === '电子内窥镜') ? '' : 'none';
  document.getElementById('params-fiber').style.display = (cat === '光纤内窥镜') ? '' : 'none';
  document.getElementById('params-optic').style.display = (cat === '光学内窥镜') ? '' : 'none';
}

// 汇总可见参数为文本，写入 parameters 文本域
function buildParametersSummary() {
  const container = document.getElementById('categoryParams');
  const visibleCards = Array.from(container.querySelectorAll('.card')).filter(c => c.style.display !== 'none');
  const parts = [];
  visibleCards.forEach(card => {
    const fields = card.querySelectorAll('input, select');
    fields.forEach(field => {
      const label = field.closest('.col-md-6')?.querySelector('.form-label')?.textContent?.trim() || field.name;
      const val = (field.tagName === 'SELECT')
        ? (field.options[field.selectedIndex]?.text || '').trim()
        : (field.value || '').trim();
      if (val) parts.push(`${label}: ${val}`);
    });
  });
  return parts.join('\n');
}

function generateAndSubmitRequirement() {
  const id = generateRequirementID();
  const pw = generateViewPassword();

  document.getElementById('requirement-id').value = id;
  document.getElementById('view-password').value = pw;

  // 生成参数概要（若用户未手动填写）
  const paramsEl = document.getElementById('parameters');
  if (paramsEl && !paramsEl.value.trim()) {
    paramsEl.value = buildParametersSummary();
  }

  // 显示编号与密码预览，提示用户记录
  const preview = document.getElementById('idPreview');
  document.getElementById('requirement-id-preview').value = id;
  document.getElementById('view-password-preview').value = pw;
  preview.style.display = '';

  // 构建数据并调用后端函数创建需求
  const form = document.getElementById('requirementForm');
  const fd = new FormData(form);
  const payload = {
    requirementID: id,
    viewPassword: pw,
    contactName: fd.get('contactName') || '',
    contactPhone: fd.get('contactPhone') || '',
    contactCompany: fd.get('contactCompany') || '',
    contactEmail: fd.get('contactEmail') || '',
    contactDepartment: fd.get('contactDepartment') || '',
    Title: fd.get('Title') || '',
    primaryCategory: fd.get('primaryCategory') || '',
    Status: fd.get('Status') || '公开',
    BudgetRange: fd.get('budgetRange') || '',
    PublicPreview: (function(){
      const title = (fd.get('Title') || '').toString();
      const cat = (fd.get('primaryCategory') || '').toString();
      const raw = (fd.get('parameters') || '').toString().trim();
      const summary = raw || buildParametersSummary();
      return [title, cat ? `分类：${cat}` : '', summary].filter(Boolean).join('\n').slice(0, 500);
    })(),
    Parameters: (function(){
      const raw = (fd.get('parameters') || '').toString();
      const map = {
        probe_diameter: 'ProbeDiameter',
        resolution: 'Resolution',
        working_length: 'WorkingLength',
        light_source: 'LightSource',
        ip_rating: 'IPRating',
        screen_size: 'ScreenSize',
        viewing_direction: 'ViewingDirection',
        guidance: 'Guidance',
        field_of_view: 'FieldOfView',
        lens_type: 'LensType',
        focal_length: 'FocalLength',
        insert_diameter: 'InsertHoleDiameter',
        insert_depth: 'InsertDepth',
        workpiece_name: 'WorkpieceName'
      };
      const params = {};
      form.querySelectorAll('input[name^="param_"], select[name^="param_"]').forEach(field => {
        const rawKey = field.name.replace(/^param_/, '');
        const val = (field.tagName === 'SELECT')
          ? (field.options[field.selectedIndex]?.value || '').trim()
          : (field.value || '').trim();
        if (!val) return;
        const unifiedKey = map[rawKey] || rawKey;
        params[unifiedKey] = val;
      });
      const plan = (fd.get('procurementPlan') || '').toString().trim();
      if (plan) params['ProcurementPlan'] = plan;
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          Object.assign(params, parsed);
        } catch {
          params['text'] = raw;
        }
      }
      return params;
    })(),
  };

  const btn = form.querySelector('button.btn-primary');
  const origText = btn?.innerHTML;
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> 发布中…'; }
  
  window.apiFetch('/api/requirements', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(r => r.json())
    .then(res => {
      if (res && res.RequirementID) {
        document.getElementById('requirement-id-preview').value = res.RequirementID;
        document.getElementById('view-password-preview').value = res.ViewPassword || pw;
        preview.style.display = '';
        // 成功提示
        const ok = document.createElement('div');
        ok.className = 'alert alert-success mt-3';
        ok.innerHTML = `<i class="fa-solid fa-check-circle me-1"></i> 需求发布成功！请妥善保存编号与查看密码。`;
        form.appendChild(ok);
      } else {
        throw new Error(res?.error || '发布失败');
      }
    })
    .catch(err => {
      console.error('Create requirement error:', err);
      const el = document.createElement('div');
      el.className = 'alert alert-danger mt-3';
      el.textContent = `发布失败：${err.message || err}`;
      form.appendChild(el);
    })
    .finally(() => { if (btn) { btn.disabled = false; btn.innerHTML = origText; } });
}
</script>
