<!-- 供应商详情弹窗 -->
<div class="modal fade supplier-modal" id="supplierModal" tabindex="-1" aria-labelledby="supplierModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content border-0 shadow-lg">
      <!-- 美化的头部 -->
      <div class="modal-header border-0 position-relative overflow-hidden" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 2rem 2rem 1rem;">
        <div class="position-absolute top-0 start-0 w-100 h-100 opacity-10 header-pattern"></div>
        <div class="d-flex align-items-center text-white position-relative">
          <div class="supplier-avatar me-3">
            <div class="bg-white bg-opacity-20 rounded-circle d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
              <i class="fas fa-building fa-2x text-white"></i>
            </div>
          </div>
          <div>
            <h4 class="modal-title mb-1 fw-bold" id="supplierModalLabel">供应商详情</h4>
            <p class="mb-0 opacity-75" id="supplier-subtitle">专业的工业内窥镜供应商</p>
          </div>
        </div>
        <button type="button" class="btn-close btn-close-white position-relative" data-bs-dismiss="modal" aria-label="Close" style="filter: brightness(0) invert(1);"></button>
      </div>

      <div class="modal-body p-0">
        <!-- 供应商信息卡片 -->
        <div class="p-4">
          <!-- 基本信息和联系方式 -->
          <div class="row g-4 mb-4">
            <!-- 基本信息卡片 -->
            <div class="col-lg-6">
              <div class="info-card h-100">
                <div class="card-header">
                  <i class="fas fa-building text-primary me-2"></i>
                  <span class="fw-semibold">基本信息</span>
                </div>
                <div class="card-body">
                  <div class="info-item">
                    <label>企业名称</label>
                    <div class="info-value" id="supplier-title">-</div>
                  </div>
                  <div class="info-item">
                    <label>企业地址</label>
                    <div class="info-value" id="supplier-address">-</div>
                  </div>
                  <div class="info-item">
                    <label>企业类型</label>
                    <div class="info-value">
                      <span class="type-badge" id="supplier-type">-</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 联系方式卡片 -->
            <div class="col-lg-6">
              <div class="info-card h-100">
                <div class="card-header">
                  <i class="fas fa-address-card text-success me-2"></i>
                  <span class="fw-semibold">联系方式</span>
                </div>
                <div class="card-body">
                  <div class="info-item">
                    <label>联系人</label>
                    <div class="info-value" id="supplier-contact-person">-</div>
                  </div>
                  <div class="info-item">
                    <label>职务</label>
                    <div class="info-value" id="supplier-position">-</div>
                  </div>
                  <div class="info-item">
                    <label>联系电话</label>
                    <div class="info-value">
                      <a href="#" id="supplier-phone-link" class="contact-link">
                        <i class="fas fa-phone me-1"></i>
                        <span id="supplier-phone">-</span>
                      </a>
                    </div>
                  </div>
                  <div class="info-item">
                    <label>电子邮箱</label>
                    <div class="info-value">
                      <a href="#" id="supplier-email-link" class="contact-link">
                        <i class="fas fa-envelope me-1"></i>
                        <span id="supplier-email">-</span>
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 产品信息卡片 -->
          <div class="row g-4 mb-4">
            <div class="col-lg-6">
              <div class="info-card">
                <div class="card-header">
                  <i class="fas fa-layer-group text-info me-2"></i>
                  <span class="fw-semibold">产品系列</span>
                </div>
                <div class="card-body">
                  <div id="supplier-series" class="badge-container">
                    <!-- 由JS动态填充 -->
                  </div>
                </div>
              </div>
            </div>

            <div class="col-lg-6">
              <div class="info-card">
                <div class="card-header">
                  <i class="fas fa-tags text-warning me-2"></i>
                  <span class="fw-semibold">产品型号</span>
                </div>
                <div class="card-body">
                  <div id="supplier-models" class="badge-container">
                    <!-- 由JS动态填充 -->
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 企业相册 -->
          <div class="info-card mb-4">
            <div class="card-header">
              <i class="fas fa-images text-purple me-2"></i>
              <span class="fw-semibold">企业相册</span>
            </div>
            <div class="card-body">
              <div class="gallery-grid" id="supplier-gallery">
                <!-- 由JS动态填充 -->
              </div>
            </div>
          </div>

          <!-- 公司简介 -->
          <div class="info-card">
            <div class="card-header">
              <i class="fas fa-info-circle text-primary me-2"></i>
              <span class="fw-semibold">公司简介</span>
            </div>
            <div class="card-body">
              <div id="supplier-description" class="company-description">
                <!-- 由JS动态填充 -->
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 美化的底部 -->
      <div class="modal-footer border-0 bg-light px-4 py-3">
        <div class="d-flex justify-content-between align-items-center w-100">
          <div class="text-muted small">
            <i class="fas fa-shield-alt me-1"></i>
            可信赖的合作伙伴
          </div>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
              <i class="fas fa-times me-1"></i>关闭
            </button>
            <a href="#" class="btn btn-gradient" id="supplier-contact-btn">
              <i class="fas fa-envelope me-1"></i>联系供应商
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 引入 Font Awesome 图标 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<!-- 引入 fslightbox 用于图片预览 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fslightbox/3.4.1/index.min.js"></script>

<style>
/* 供应商弹窗美化样式 */
.supplier-modal .modal-content {
  border: none;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
}

.supplier-modal .modal-header {
  border-bottom: none;
  border-radius: 20px 20px 0 0;
}

/* 头部装饰图案 */
.supplier-modal .header-pattern {
  background-image: radial-gradient(circle at 25% 25%, rgba(255,255,255,0.3) 1px, transparent 1px),
                    radial-gradient(circle at 75% 75%, rgba(255,255,255,0.2) 1px, transparent 1px),
                    radial-gradient(circle at 50% 10%, rgba(255,255,255,0.4) 0.5px, transparent 0.5px);
  background-size: 50px 50px, 50px 50px, 50px 50px;
}

.supplier-modal .modal-body {
  padding: 0;
  background: #f8f9fa;
}

/* 信息卡片样式 */
.supplier-modal .info-card {
  background: white;
  border-radius: 16px;
  border: none;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  overflow: hidden;
  transition: all 0.3s ease;
}

.supplier-modal .info-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
}

.supplier-modal .info-card .card-header {
  background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
  border: none;
  padding: 1rem 1.5rem;
  font-size: 0.95rem;
  border-bottom: 1px solid #e9ecef;
}

.supplier-modal .info-card .card-body {
  padding: 1.5rem;
}

/* 信息项样式 */
.supplier-modal .info-item {
  margin-bottom: 1.2rem;
}

.supplier-modal .info-item:last-child {
  margin-bottom: 0;
}

.supplier-modal .info-item label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: #6c757d;
  margin-bottom: 0.4rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.supplier-modal .info-value {
  font-size: 1rem;
  color: #212529;
  font-weight: 500;
}

/* 类型徽章 */
.supplier-modal .type-badge {
  display: inline-block;
  padding: 0.4rem 1rem;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
}

/* 联系链接 */
.supplier-modal .contact-link {
  color: #667eea;
  text-decoration: none;
  transition: all 0.3s ease;
  display: inline-flex;
  align-items: center;
}

.supplier-modal .contact-link:hover {
  color: #764ba2;
  transform: translateX(2px);
}

/* 徽章容器 */
.supplier-modal .badge-container {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  min-height: 40px;
  align-items: flex-start;
}

.supplier-modal .badge-container .badge {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  padding: 0.5rem 1rem;
  border-radius: 20px;
  font-weight: 500;
  font-size: 0.85rem;
  transition: all 0.3s ease;
}

.supplier-modal .badge-container .badge:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
}

/* 相册网格 */
.supplier-modal .gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1rem;
  min-height: 100px;
}

.supplier-modal .gallery-item {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  aspect-ratio: 4/3;
  background: #f8f9fa;
  cursor: pointer;
  transition: all 0.3s ease;
  border: 2px solid transparent;
}

.supplier-modal .gallery-item:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
  border-color: #667eea;
}

.supplier-modal .gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: all 0.3s ease;
}

.supplier-modal .gallery-item:hover img {
  transform: scale(1.05);
}

/* 公司简介 */
.supplier-modal .company-description {
  line-height: 1.8;
  color: #495057;
  font-size: 0.95rem;
}

/* 渐变按钮 */
.supplier-modal .btn-gradient {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border: none;
  color: white;
  padding: 0.6rem 1.5rem;
  border-radius: 25px;
  font-weight: 600;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
}

.supplier-modal .btn-gradient:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
  color: white;
}

/* 紫色图标 */
.text-purple {
  color: #764ba2 !important;
}

/* 响应式调整 */
@media (max-width: 768px) {
  .supplier-modal .modal-dialog {
    margin: 1rem;
  }

  .supplier-modal .gallery-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .supplier-modal .info-card .card-body {
    padding: 1rem;
  }
}
</style>

<!-- 供应商弹窗脚本 -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var supplierModal = document.getElementById('supplierModal');
    if (supplierModal) {
      supplierModal.addEventListener('show.bs.modal', function(event) {
        var button = event.relatedTarget;
  
        // 获取基础字段
        var title = button.getAttribute('data-supplier-title') || '未知供应商';
        var address = button.getAttribute('data-supplier-address') || '未提供';
        var type = button.getAttribute('data-supplier-type') || '未提供';
        var contactPerson = button.getAttribute('data-supplier-contact-person') || '未提供';
        var position = button.getAttribute('data-supplier-position') || '未提供';
        var phone = button.getAttribute('data-supplier-phone') || '未提供';
        var email = button.getAttribute('data-supplier-email') || '未提供';
        var description = button.getAttribute('data-supplier-content') || '暂无简介';
        var series = button.getAttribute('data-supplier-series');
        var models = button.getAttribute('data-supplier-models');
        var gallery = button.getAttribute('data-supplier-gallery');
  
        // 填充基础信息
        document.getElementById('supplierModalLabel').textContent = title;
        document.getElementById('supplier-subtitle').textContent = type + ' · 专业供应商';
        document.getElementById('supplier-title').textContent = title;
        document.getElementById('supplier-address').textContent = address;
        document.getElementById('supplier-type').textContent = type;
        document.getElementById('supplier-contact-person').textContent = contactPerson;
        document.getElementById('supplier-position').textContent = position;
        document.getElementById('supplier-phone').textContent = phone;
        document.getElementById('supplier-email').textContent = email;
        document.getElementById('supplier-description').innerHTML = description;

        // 设置链接
        var phoneLink = document.getElementById('supplier-phone-link');
        var emailLink = document.getElementById('supplier-email-link');
        phoneLink.href = 'tel:' + phone;
        emailLink.href = 'mailto:' + email;

        var contactBtn = document.getElementById('supplier-contact-btn');
        contactBtn.href = 'mailto:' + email + '?subject=询价咨询 - ' + title;
  
        // 处理产品系列
        var seriesContainer = document.getElementById('supplier-series');
        seriesContainer.innerHTML = '';
        if (series) {
          try {
            var seriesArray = JSON.parse(series);
            if (seriesArray.length > 0) {
              seriesArray.forEach(function(item) {
                var badge = document.createElement('span');
                badge.className = 'badge';
                badge.textContent = item;
                seriesContainer.appendChild(badge);
              });
            } else {
              seriesContainer.innerHTML = '<div class="text-muted text-center py-3"><i class="fas fa-box-open me-2"></i>暂无产品系列信息</div>';
            }
          } catch (e) {
            seriesContainer.innerHTML = '<div class="text-muted text-center py-3"><i class="fas fa-exclamation-triangle me-2"></i>数据解析错误</div>';
          }
        } else {
          seriesContainer.innerHTML = '<div class="text-muted text-center py-3"><i class="fas fa-box-open me-2"></i>暂无产品系列信息</div>';
        }

        // 处理产品型号
        var modelsContainer = document.getElementById('supplier-models');
        modelsContainer.innerHTML = '';
        if (models) {
          try {
            var modelsArray = JSON.parse(models);
            if (modelsArray.length > 0) {
              modelsArray.forEach(function(item) {
                var badge = document.createElement('span');
                badge.className = 'badge';
                badge.textContent = item;
                modelsContainer.appendChild(badge);
              });
            } else {
              modelsContainer.innerHTML = '<div class="text-muted text-center py-3"><i class="fas fa-tags me-2"></i>暂无产品型号信息</div>';
            }
          } catch (e) {
            modelsContainer.innerHTML = '<div class="text-muted text-center py-3"><i class="fas fa-exclamation-triangle me-2"></i>数据解析错误</div>';
          }
        } else {
          modelsContainer.innerHTML = '<div class="text-muted text-center py-3"><i class="fas fa-tags me-2"></i>暂无产品型号信息</div>';
        }
  
        // 处理企业相册
        var galleryContainer = document.getElementById('supplier-gallery');
        galleryContainer.innerHTML = '';
        if (gallery) {
          try {
            var galleryArray = JSON.parse(gallery);
            if (galleryArray.length > 0) {
              galleryArray.forEach(function(item, index) {
                var imgWrapper = document.createElement('div');
                imgWrapper.className = 'gallery-item';

                var img = document.createElement('img');
                img.src = item;
                img.alt = '企业图片 ' + (index + 1);
                img.setAttribute('data-fslightbox', 'supplier-gallery');

                // 添加点击事件
                imgWrapper.onclick = function () {
                  if (typeof fsLightboxInstances !== 'undefined' && fsLightboxInstances['supplier-gallery']) {
                    fsLightboxInstances['supplier-gallery'].open(index);
                  }
                };

                // 图片加载错误处理
                img.onerror = function () {
                  img.src = 'https://via.placeholder.com/300x200/f8f9fa/6c757d?text=图片加载失败';
                  img.alt = '图片加载失败';
                };

                imgWrapper.appendChild(img);
                galleryContainer.appendChild(imgWrapper);
              });

              // 刷新lightbox
              if (typeof refreshFsLightbox === 'function') {
                refreshFsLightbox();
              }
            } else {
              galleryContainer.innerHTML = '<div class="text-muted text-center py-5"><i class="fas fa-images fa-2x mb-3 d-block"></i>暂无企业相册</div>';
            }
          } catch (e) {
            galleryContainer.innerHTML = '<div class="text-muted text-center py-5"><i class="fas fa-exclamation-triangle fa-2x mb-3 d-block"></i>相册数据解析错误</div>';
          }
        } else {
          galleryContainer.innerHTML = '<div class="text-muted text-center py-5"><i class="fas fa-images fa-2x mb-3 d-block"></i>暂无企业相册</div>';
        }
  
      });
    }
  });
  console.log({
  title, address, type, contactPerson, position, phone, email, description, series, models, gallery
});

  </script>
