<style>
.password-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1050;
}
.password-modal {
  background: #fff;
  border-radius: .5rem;
  box-shadow: 0 10px 30px rgba(0,0,0,.15);
  width: 100%;
  max-width: 420px;
}
.password-modal-header { padding: 1rem 1.25rem; border-bottom: 1px solid #eee; }
.password-modal-body { padding: 1rem 1.25rem; }
.password-modal-footer { padding: .75rem 1.25rem; border-top: 1px solid #eee; text-align: right; }
</style>

<div id="passwordModalBackdrop" class="password-modal-backdrop">
  <div class="password-modal">
    <div class="password-modal-header">
      <strong>输入查看密码</strong>
    </div>
    <div class="password-modal-body">
      <div class="mb-3">
        <label class="form-label">查看密码</label>
        <input type="password" id="passwordModalInput" class="form-control" placeholder="请输入6位密码" />
      </div>
      <div class="text-muted" style="font-size:.9rem;">提示：密码由平台在审核后通过短信/邮件发送。</div>
    </div>
    <div class="password-modal-footer">
      <button type="button" class="btn btn-outline-secondary me-2" onclick="hidePasswordModal()">取消</button>
      <button type="button" class="btn btn-primary" onclick="confirmPasswordModal()">确认</button>
    </div>
  </div>
  </div>

<script>
let __passwordModalCallback = null;

function showPasswordModal(cb) {
  __passwordModalCallback = cb;
  const backdrop = document.getElementById('passwordModalBackdrop');
  const input = document.getElementById('passwordModalInput');
  backdrop.style.display = 'flex';
  setTimeout(()=> input?.focus(), 0);
}

function hidePasswordModal() {
  const backdrop = document.getElementById('passwordModalBackdrop');
  backdrop.style.display = 'none';
}

function confirmPasswordModal() {
  const input = document.getElementById('passwordModalInput');
  const val = (input?.value || '').trim();
  if (!val) { alert('请输入密码'); return; }
  try { __passwordModalCallback && __passwordModalCallback(val); } catch(e) { console.error(e); }
  hidePasswordModal();
}
</script>
